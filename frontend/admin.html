function formatVND(amount) {
  if (typeof amount !== 'number') amount = Number(amount) || 0;
  return new Intl.NumberFormat('vi-VN').format(amount) + '₫';
}

function formatDate(isoStr) {
  if (!isoStr) return '--';
  try {
    const d = new Date(isoStr);
    return d.toLocaleString('vi-VN', {
      hour: '2-digit', minute: '2-digit',
      day: '2-digit', month: '2-digit', year: 'numeric'
    });
  } catch {
    return isoStr;
  }
}

function toVietnameseSlug(str) {
  if (!str) return '';
  return str
    .toLowerCase()
    .normalize('NFD')
    .replace(/[̀-ͯ]/g, '')
    .replace(/đ/g, 'd')
    .replace(/Đ/g, 'd')
    .replace(/[^a-z0-9\s-]/g, '')
    .trim()
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-');
}

function RichTextEditor({ initialValue = "", onChange, editorId = "product-quill-editor" }) {
  const editorDivRef = React.useRef(null);
  const quillRef = React.useRef(null);
  const [activeMode, setActiveMode] = React.useState("edit"); // "edit" | "preview"
  const [content, setContent] = React.useState(initialValue || "");
  const [isFullscreen, setIsFullscreen] = React.useState(false);

  React.useEffect(() => {
    let isMounted = true;
    if (editorDivRef.current && window.Quill && !quillRef.current) {
      try {
        const quill = new window.Quill(editorDivRef.current, {
          theme: "snow",
          placeholder: "Soạn thảo bài viết đánh giá, cấu hình, thông số chi tiết (hỗ trợ tiêu đề H1/H2, bảng biểu, in đậm/nghiêng, chèn ảnh, video, danh sách)...",
          modules: {
            toolbar: [
              [{ header: [1, 2, 3, false] }],
              ["bold", "italic", "underline", "strike"],
              [{ color: [] }, { background: [] }],
              [{ list: "ordered" }, { list: "bullet" }],
              ["blockquote", "code-block"],
              [{ align: [] }],
              ["link", "image", "video"],
              ["clean"],
            ],
            table: true,
          },
        });

        if (initialValue) {
          quill.clipboard.dangerouslyPasteHTML(initialValue);
        }

        quill.on("text-change", () => {
          if (!isMounted) return;
          const html = quill.root.innerHTML;
          setContent(html);
          if (onChange) onChange(html);
        });

        quillRef.current = quill;
      } catch (err) {
        console.warn("[Quill Init Error]", err);
      }
    }

    return () => {
      isMounted = false;
      quillRef.current = null;
    };
  }, []);

  // Update content if initialValue changes externally
  React.useEffect(() => {
    if (quillRef.current && initialValue && quillRef.current.root.innerHTML !== initialValue) {
      quillRef.current.clipboard.dangerouslyPasteHTML(initialValue);
      setContent(initialValue);
    }
  }, [initialValue]);

  // Bộ thao tác Bảng biểu (Table Operations)
  const handleInsertBlankTable = () => {
    if (!quillRef.current) return;
    try {
      quillRef.current.focus();
      let sel = quillRef.current.getSelection();
      if (!sel) {
        const len = quillRef.current.getLength();
        quillRef.current.setSelection(len, 0);
      }
      const tableModule = quillRef.current.getModule("table");
      if (tableModule && typeof tableModule.insertTable === "function") {
        tableModule.insertTable(5, 2);
      } else {
        const html = "<table><tbody><tr><td>Thông số</td><td>Chi tiết</td></tr><tr><td>Màn hình</td><td>...</td></tr><tr><td>CPU</td><td>...</td></tr><tr><td>RAM</td><td>...</td></tr><tr><td>Pin</td><td>...</td></tr></tbody></table><p><br></p>";
        const range = quillRef.current.getSelection() || { index: quillRef.current.getLength() };
        quillRef.current.clipboard.dangerouslyPasteHTML(range.index, html);
      }
      const updated = quillRef.current.root.innerHTML;
      setContent(updated);
      if (onChange) onChange(updated);
    } catch (e) {
      console.warn("Table insert error:", e);
    }
  };

  const handleInsertSpecsTemplate = () => {
    if (!quillRef.current) return;
    try {
      quillRef.current.focus();
      const range = quillRef.current.getSelection() || { index: quillRef.current.getLength() };
      const template = `<h3>Thông số kỹ thuật chi tiết</h3><table><tbody><tr><td><strong>Màn hình</strong></td><td>6.3 inch, Super Retina XDR OLED, 120Hz ProMotion</td></tr><tr><td><strong>Vi xử lý (CPU)</strong></td><td>Apple A18 Pro 6 nhân (3nm), GPU 6 nhân</td></tr><tr><td><strong>RAM</strong></td><td>8 GB</td></tr><tr><td><strong>Camera sau</strong></td><td>Chính 48MP Fusion + Góc siêu rộng 48MP + Telephoto 5x 12MP</td></tr><tr><td><strong>Camera trước</strong></td><td>12MP TrueDepth với Autofocus</td></tr><tr><td><strong>Pin &amp; Sạc</strong></td><td>Thời lượng xem video lên tới 27 giờ, Sạc nhanh 50% trong 30 phút</td></tr><tr><td><strong>Hệ điều hành</strong></td><td>iOS 18 tích hợp Apple Intelligence</td></tr><tr><td><strong>Trọng lượng</strong></td><td>199 g</td></tr><tr><td><strong>Kết nối &amp; Tiện ích</strong></td><td>5G, Wi-Fi 7, Bluetooth 5.3, Cổng USB-C tốc độ 10Gb/s</td></tr></tbody></table><p><br></p>`;
      quillRef.current.clipboard.dangerouslyPasteHTML(range.index, template);
      const updated = quillRef.current.root.innerHTML;
      setContent(updated);
      if (onChange) onChange(updated);
    } catch (e) {
      console.warn("Template insert error:", e);
    }
  };

  const handleTableAction = (action) => {
    if (!quillRef.current) return;
    try {
      quillRef.current.focus();
      const tableModule = quillRef.current.getModule("table");
      if (!tableModule) return;
      if (action === "insertRow") tableModule.insertRowBelow();
      else if (action === "insertCol") tableModule.insertColumnRight();
      else if (action === "deleteRow") tableModule.deleteRow();
      else if (action === "deleteCol") tableModule.deleteColumn();
      else if (action === "deleteTable") {
        if (confirm("Bạn có chắc muốn xóa toàn bộ bảng này không?")) {
          tableModule.deleteTable();
        }
      }
      const updated = quillRef.current.root.innerHTML;
      setContent(updated);
      if (onChange) onChange(updated);
    } catch (e) {
      console.warn("Table action error:", e);
    }
  };

  return (
    <div className={`space-y-3 ${isFullscreen ? "fixed inset-0 z-[100] bg-white p-6 overflow-y-auto shadow-2xl animate-in zoom-in-95 duration-150" : ""}`}>
      {/* Action Header */}
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-[#F8FAFC] border border-[#CBD5E1] p-3 rounded-xl">
        <div className="flex items-center gap-2">
          <button
            type="button"
            onClick={() => setActiveMode("edit")}
            className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer flex items-center gap-1.5 ${

            <span className="font-bold text-[#334155] flex items-center gap-1 mr-1 text-[11px] uppercase tracking-wider">
              <Icon name="grid" className="w-3.5 h-3.5 text-[#0275A9]" />

            <button
              type="button"

              title="Chèn ngay mẫu bảng thông số kỹ thuật 2 cột chuẩn thiết bị công nghệ"
            >
              <Icon name="file-text" className="w-3 h-3" />
              <span>📊 Mẫu bảng thông số kỹ thuật</span>

            <button
              type="button"

              title="Thêm dòng mới bên dưới con trỏ"

              title="Thêm cột mới bên phải con trỏ"
            >

            <button
              type="button"
              onClick={() => handleTableAction("deleteRow")}

              title="Xóa dòng tại vị trí con trỏ"

            <button
              type="button"
              onClick={() => handleTableAction("deleteCol")}
              className="px-2 py-1 bg-white hover:bg-rose-50 text-rose-600 border border-[#CBD5E1] hover:border-rose-300 rounded text-[11px] font-semibold transition flex items-center gap-1 cursor-pointer"
              title="Xóa cột tại vị trí con trỏ"
            >

            <button
              type="button"
              onClick={() => handleTableAction("deleteTable")}
              className="px-2 py-1 bg-white hover:bg-rose-100 text-rose-700 border border-rose-300 rounded text-[11px] font-bold transition flex items-center gap-1 cursor-pointer ml-auto"
              title="Xóa hoàn toàn bảng này"
            >
              <Icon name="trash-2" className="w-3 h-3" />

      ) : (
        <div className="p-6 bg-white border border-[#CBD5E1] rounded-xl shadow-2xs min-h-[420px] max-h-[700px] overflow-y-auto">
          <div className="text-xs font-bold text-[#0275A9] mb-4 pb-2 border-b border-[#E5E8EC] flex items-center gap-2">
            <Icon name="check-circle" className="w-4 h-4 text-emerald-600" />
            <span>Xem trước bài viết thực tế sẽ xuất hiện trên trang chi tiết sản phẩm:</span>
          </div>

            className="product-rich-desc text-[#141923] text-sm leading-relaxed space-y-4"
            dangerouslySetInnerHTML={{
              __html: content || "<p class='text-[#707783] italic'>Chưa có nội dung mô tả nào. Hãy bấm sang tab Soạn thảo để viết bài.</p>",
            }}
          />

      )}

  );
}

// =========================================================================
function ProductFormModal({ product, onClose, onSave, categories, presetImages }) {
  const isEditing = Boolean(product && product.id);

  // 1. Basic Commercial Information & Pricing
  const [name, setName] = useState(product?.name || "");
  const [fullName, setFullName] = useState(product?.fullName || product?.tenDayDu || product?.name || "");
  const [brand, setBrand] = useState(product?.brand || "apple");
  const [category, setCategory] = useState(product?.category || "phones");
  const [price, setPrice] = useState(() => Number(product?.price ?? product?.giaBan) || 0);
  const [hasDiscount, setHasDiscount] = useState(() => {
    if (product?.hasDiscount !== undefined) return Boolean(product.hasDiscount);
    const orig = Number(product?.originalPrice ?? product?.giaGoc) || 0;
    const p = Number(product?.price ?? product?.giaBan) || 0;
    return orig > p && orig > 0;
  });
  const [originalPrice, setOriginalPrice] = useState(() => {
    const orig = Number(product?.originalPrice ?? product?.giaGoc) || 0;
    const p = Number(product?.price ?? product?.giaBan) || 0;
    if (orig > p) return orig;
    return 0;
  });
  const [discountAmount, setDiscountAmount] = useState(() => {
    if (product?.discountAmount !== undefined && (product?.hasDiscount || (product?.originalPrice && product?.originalPrice > product?.price))) {
      return product.discountAmount;
    }
    const orig = Number(product?.originalPrice ?? product?.giaGoc) || 0;
    const p = Number(product?.price ?? product?.giaBan) || 0;
    if (orig > p) return orig - p;
    return 0;
  });
  const [customPercent, setCustomPercent] = useState(() => {
    const orig = Number(product?.originalPrice ?? product?.giaGoc) || 0;
    const p = Number(product?.price ?? product?.giaBan) || 0;
    if (orig > p && orig > 0) {
      return String(Math.round(((orig - p) / orig) * 100));
    }
    return "";
  });
  const [isInstallment, setIsInstallment] = useState(() => {
    if (product?.isInstallment !== undefined) return Boolean(product.isInstallment);
    if (product?.category === "accessories" || (product?.price && product.price < 1000000)) return false;
    return true;
  });
  const [stock, setStock] = useState(product?.stock ?? 50);
  const [status, setStatus] = useState(product?.status || "active");
  const [badge, setBadge] = useState(product?.badge || product?.huyHieu || "");
  const [gift, setGift] = useState(product?.gift || product?.quaTang || "");
  const [specsShort, setSpecsShort] = useState(product?.specsShort || product?.thongSoNgan || "");

  // 2. Images & Gallery
  const [gallery, setGallery] = useState(() => {
    if (product?.gallery && product.gallery.length > 0) return product.gallery;
    if (product?.img) return [product.img];
    return [presetImages[0]?.path || "src/assets/img/phone-iphone-16-pro.png"];
  });
  const [img, setImg] = useState(() => {
    if (product?.img) return product.img;
    return gallery[0] || presetImages[0]?.path || "src/assets/img/phone-iphone-16-pro.png";
  });
  const [customUrl, setCustomUrl] = useState("");

  // 3. Hệ thống Phân loại hàng Đa nhóm (Khai báo trước để đồng bộ 2 chiều toàn diện)
  const [hasVariants, setHasVariants] = useState(() => {
    return Boolean(
      (product?.variantGroups && product.variantGroups.length > 0) ||
      (product?.variants && product.variants.length > 0) ||
      (product?.colors && product.colors.length > 0)
    );
  });

  const [variantGroups, setVariantGroups] = useState(() => {
    const baseImg = product?.img || (product?.gallery?.[0] || "");
    if (product?.variantGroups && product.variantGroups.length > 0) {
      return product.variantGroups.map((g, i) => ({
        id: g.id || ("grp_" + (i + 1)),
        name: g.name || ("Nhóm " + (i + 1)),
        options: (g.options && g.options.length > 0)
          ? g.options.map((o, j) => ({
              id: o.id || ("opt_" + (i + 1) + "_" + (j + 1)),
              name: o.name || ("Lựa chọn " + (j + 1)),
              img: o.img || "",
              priceDiff: o.priceDiff !== undefined ? Number(o.priceDiff) : 0,
            }))
          : [{ id: "opt_" + (i + 1) + "_1", name: "", img: "", priceDiff: 0 }]
      }));
    }
    // Migration: nếu sản phẩm cũ có colors & storageOptions
    const legacyGroups = [];
    if (product?.colors && product.colors.length > 0) {
      legacyGroups.push({
        id: "grp_colors",
        name: product.variantGroupName || product.variantGroup1Name || "Màu sắc",
        options: product.colors.map((c, idx) => ({
          id: c.id || `c_${idx}`,
          name: c.name,
          img: c.img || product.gallery?.[idx] || baseImg,
          priceDiff: 0,
        })),
      });
    }
    if (product?.storageOptions && product.storageOptions.length > 1) {
      legacyGroups.push({
        id: "grp_storage",
        name: product.variantGroup2Name || "Dung lượng",
        options: product.storageOptions.map((s, idx) => ({
          id: s.id || `s_${idx}`,
          name: s.label || s.name,
          img: "",
          priceDiff: s.priceDiff || 0,
        })),
      });
    }
    return legacyGroups.length > 0 ? legacyGroups : [
      { id: "grp_1", name: "Màu sắc", options: [{ id: "opt_1_1", name: "", img: "", priceDiff: 0 }] }
    ];
  });

  const [combinationPrices, setCombinationPrices] = useState(() => {
    const prices = {};
    if (product?.variants && product.variants.length > 0) {
      product.variants.forEach((v) => {
        const key = v.name || (v.options ? v.options.join(" · ") : v.group1);
        if (v.price !== undefined) {
          prices[key] = v.price;
        }
      });
    }
    return prices;
  });

  const [combinationOrigPrices, setCombinationOrigPrices] = useState(() => {
    const origs = {};
    if (product?.variants && product.variants.length > 0) {
      product.variants.forEach((v) => {
        const key = v.name || (v.options ? v.options.join(" · ") : v.group1);
        if (v.originalPrice !== undefined) {
          origs[key] = v.originalPrice;
        } else if (v.giaGoc !== undefined) {
          origs[key] = v.giaGoc;
        }
      });
    }
    return origs;
  });

  const [combinationDiscounts, setCombinationDiscounts] = useState(() => {
    const discs = {};
    if (product?.variants && product.variants.length > 0) {
      product.variants.forEach((v) => {
        const key = v.name || (v.options ? v.options.join(" · ") : v.group1);
        if (v.hasDiscount !== undefined) {
          discs[key] = Boolean(v.hasDiscount);
        }
      });
    }
    return discs;
  });

  const [combinationStocks, setCombinationStocks] = useState(() => {
    const init = {};
    if (product?.variants && Array.isArray(product.variants)) {
      product.variants.forEach((v) => {
        const k = v.name || (v.options && v.options.join(" · "));
        if (k && v.stock !== undefined) {
          init[k] = v.stock;
        }
      });
    }
    return init;
  });

  const [batchPriceInput, setBatchPriceInput] = useState("");
  const [batchOrigPriceInput, setBatchOrigPriceInput] = useState("");
  const [batchStockInput, setBatchStockInput] = useState("");
  const [batchDiscountPctInput, setBatchDiscountPctInput] = useState("");

  // =========================================================================
  // HANDLERS ĐỒNG BỘ 2 CHIỀU GIỮA PHẦN 1 VÀ PHẦN 3
  // =========================================================================

  const handleToggleDiscount = (enabled) => {
    setHasDiscount(enabled);
    if (!enabled) {
      setOriginalPrice(0);
      setDiscountAmount(0);
      setCustomPercent("");
      setCombinationDiscounts((prev) => {
        const next = { ...prev };
        Object.keys(next).forEach((k) => { next[k] = false; });
        return next;
      });
      // Khi tắt giảm giá -> đặt giá bán biến thể về giá gốc
      setCombinationPrices((prev) => {
        const next = { ...prev };
        Object.keys(next).forEach((k) => {
          if (combinationOrigPrices[k] !== undefined && combinationOrigPrices[k] !== "") {
            next[k] = combinationOrigPrices[k];
          }
        });
        return next;
      });
    } else {
      const currentP = Number(price) || 0;
      const orig = currentP > 0 ? currentP : 1000000;
      const pct = 10;
      const disc = Math.round((orig * pct) / 100);
      const saleP = Math.max(0, orig - disc);
      setOriginalPrice(orig);
      setDiscountAmount(disc);
      setCustomPercent(String(pct));
      setPrice(saleP);
      // Bật giảm giá cho toàn bộ biến thể và áp dụng mức giảm 10%
      setCombinationDiscounts((prev) => {
        const next = { ...prev };
        Object.keys(next).forEach((k) => { next[k] = true; });
        return next;
      });
      setCombinationPrices((prev) => {
        const next = { ...prev };
        Object.keys(next).forEach((k) => {
          const vOrig = Number(combinationOrigPrices[k]) || orig;
          next[k] = Math.round(vOrig * 0.9);
        });
        return next;
      });
    }
  };

  const handlePercentInputChange = (val) => {
    setCustomPercent(val);
    const pct = Number(val);
    if (!val || isNaN(pct) || pct <= 0) {
      setDiscountAmount(0);
      if (originalPrice > 0) {
        setPrice(originalPrice);
      }
      return;
    }
    setHasDiscount(true);
    let orig = Number(originalPrice) || 0;
    const p = Number(price) || 0;
    if (orig <= 0) {
      orig = p > 0 ? p : 1000000;
      setOriginalPrice(orig);
    }
    const safePct = Math.min(Math.max(pct, 1), 99);
    const disc = Math.round((orig * safePct) / 100);
    const newPrice = Math.max(0, orig - disc);
    setDiscountAmount(disc);
    setPrice(newPrice);

    // Đồng bộ mức giảm % cho các biến thể
    setCombinationPrices((prev) => {
      const next = { ...prev };
      Object.keys(next).forEach((k) => {
        if (combinationDiscounts[k] !== false) {
          const vOrig = Number(combinationOrigPrices[k]) || orig;
          next[k] = Math.round(vOrig * (1 - safePct / 100));
        }
      });
      return next;
    });
  };

  const handleDiscountAmountChange = (val) => {
    const disc = Math.max(0, Number(val) || 0);
    setDiscountAmount(disc);
    if (disc === 0) {
      setCustomPercent("");
      if (originalPrice > 0) {
        setPrice(originalPrice);
      }
      return;
    }
    setHasDiscount(true);
    let orig = Number(originalPrice) || 0;
    const p = Number(price) || 0;
    if (orig <= 0) {
      orig = p > 0 ? p : disc;
      setOriginalPrice(orig);
    }
    if (orig > 0) {
      const calcPrice = Math.max(0, orig - disc);
      setPrice(calcPrice);
      const pct = Math.min(99, Math.round((disc / orig) * 100));
      setCustomPercent(String(pct));

      // Đồng bộ mức giảm tiền sang các biến thể
      setCombinationPrices((prev) => {
        const next = { ...prev };
        Object.keys(next).forEach((k) => {
          if (combinationDiscounts[k] !== false) {
            const vOrig = Number(combinationOrigPrices[k]) || orig;
            next[k] = Math.max(0, vOrig - disc);
          }
        });
        return next;
      });
    }
  };

  const handleOriginalPriceChange = (val) => {
    const orig = Math.max(0, Number(val) || 0);
    const oldOrig = Number(originalPrice) || 0;
    const delta = orig - oldOrig;
    setOriginalPrice(orig);
    const p = Number(price) || 0;
    if (orig > p && orig > 0) {
      const disc = orig - p;
      setDiscountAmount(disc);
      setCustomPercent(String(Math.round((disc / orig) * 100)));
    } else {
      setDiscountAmount(0);
      setCustomPercent("");
    }

    // Đồng bộ thay đổi giá gốc sang biến thể
    if (delta !== 0) {
      setCombinationOrigPrices((prev) => {
        const next = { ...prev };
        Object.keys(next).forEach((k) => {
          const cur = Number(next[k]) || orig;
          next[k] = Math.max(0, cur + delta);
        });
        return next;
      });
    }
  };

  const handlePriceChange = (val) => {
    const p = Math.max(0, Number(val) || 0);
    const oldP = Number(price) || 0;
    const delta = p - oldP;
    setPrice(p);
    if (hasDiscount) {
      let orig = Number(originalPrice) || 0;
      if (orig > p && orig > 0) {
        const disc = orig - p;
        setDiscountAmount(disc);
        setCustomPercent(String(Math.round((disc / orig) * 100)));
      } else {
        setOriginalPrice(p);
        setDiscountAmount(0);
        setCustomPercent("");
      }
    }

    // Đồng bộ thay đổi giá bán sang các biến thể
    if (delta !== 0) {
      setCombinationPrices((prev) => {
        const next = { ...prev };
        Object.keys(next).forEach((k) => {
          const cur = Number(next[k]) || p;
          next[k] = Math.max(0, cur + delta);
        });
        return next;
      });
    }
  };

  const handleBaseStockChange = (val) => {
    const total = Math.max(0, parseInt(val, 10) || 0);
    setStock(total);
    if (hasVariants) {
      const keys = Object.keys(combinationStocks);
      if (keys.length > 0) {
        const perVar = Math.floor(total / keys.length);
        const rem = total % keys.length;
        const updated = {};
        keys.forEach((k, idx) => {
          updated[k] = perVar + (idx === 0 ? rem : 0);
        });
        setCombinationStocks(updated);
      }
    }
  };

  const handleMultipleFileUpload = (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    const validFiles = files.filter((f) => f.size <= 2 * 1024 * 1024);
    if (validFiles.length < files.length) {
      alert("Một số hình ảnh vượt quá 2MB đã được bỏ qua để tối ưu dung lượng bộ nhớ.");
    }
    const readers = validFiles.map((file) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (evt) => resolve(evt.target.result);
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(file);
      });
    });
    Promise.all(readers).then((results) => {
      const successful = results.filter(Boolean);
      if (successful.length > 0) {
        setGallery((prev) => {
          const merged = [...prev, ...successful];
          if (!img || prev.length === 0) setImg(successful[0]);
          return merged;
        });
      }
    });
  };

  const handleAddPreset = (path) => {
    if (!gallery.includes(path)) {
      setGallery((prev) => [...prev, path]);
      if (!img) setImg(path);
    } else {
      setImg(path);
    }
  };

  const handleAddCustomUrl = () => {
    const trimmed = customUrl.trim();
    if (!trimmed) return;
    if (!gallery.includes(trimmed)) {
      setGallery((prev) => [...prev, trimmed]);
      if (!img) setImg(trimmed);
      setCustomUrl("");
    }
  };

  const handleRemoveImage = (idxToRemove) => {
    if (gallery.length <= 1) {
      alert("Sản phẩm cần có ít nhất 1 hình ảnh đại diện.");
      return;
    }
    const targetUrl = gallery[idxToRemove];
    const updated = gallery.filter((_, idx) => idx !== idxToRemove);
    if (targetUrl === img) setImg(updated[0]);
    setGallery(updated);
  };

  const handleAddVariantGroup = () => {
    const newIdx = variantGroups.length + 1;
    setVariantGroups([
      ...variantGroups,
      {
        id: "grp_" + Date.now(),
        name: `Nhóm ${newIdx}`,
        options: [{ id: "opt_" + Date.now() + "_1", name: "", img: "", priceDiff: 0 }],
      },
    ]);
  };
  const handleAddGroup = handleAddVariantGroup;

  const handleRemoveVariantGroup = (groupIdx) => {
    if (variantGroups.length <= 1) {
      alert("Cần giữ lại ít nhất 1 nhóm phân loại, hoặc bạn có thể tắt tính năng Biến thể ở công tắc phía trên.");
      return;
    }
    setVariantGroups(variantGroups.filter((_, idx) => idx !== groupIdx));
  };
  const handleRemoveGroup = handleRemoveVariantGroup;

  const handleUpdateGroupName = (groupIdx, val) => {
    setVariantGroups((prev) =>
      prev.map((g, idx) => (idx === groupIdx ? { ...g, name: val } : g))
    );
  };

  const handleAddVariantOption = (groupIdx) => {
    setVariantGroups((prev) =>
      prev.map((g, idx) => {
        if (idx !== groupIdx) return g;
        return {
          ...g,
          options: [
            ...g.options,
            { id: "opt_" + Date.now(), name: "", img: "", priceDiff: 0 },
          ],
        };
      })
    );
  };
  const handleAddOption = handleAddVariantOption;

  const handleRemoveVariantOption = (groupIdx, optIdx) => {
    setVariantGroups((prev) =>
      prev.map((g, idx) => {
        if (idx !== groupIdx) return g;
        if (g.options.length <= 1) {
          alert("Mỗi nhóm cần ít nhất 1 lựa chọn.");
          return g;
        }
        return {
          ...g,
          options: g.options.filter((_, i) => i !== optIdx),
        };
      })
    );
  };
  const handleRemoveOption = handleRemoveVariantOption;

  const handleUpdateOption = (groupIdx, optIdx, field, val) => {
    setVariantGroups((prev) =>
      prev.map((g, idx) => {
        if (idx !== groupIdx) return g;
        return {
          ...g,
          options: g.options.map((o, i) => {
            if (i !== optIdx) return o;
            return { ...o, [field]: val };
          }),
        };
      })
    );
  };

  const handleApplyBatchPrice = (combosList) => {
    if (batchPriceInput === "" || isNaN(batchPriceInput)) {
      alert("Vui lòng nhập giá bán hợp lệ!");
      return;
    }
    const p = Math.max(0, Number(batchPriceInput) || 0);
    const updated = { ...combinationPrices };
    combosList.forEach((c) => {
      updated[c.key] = p;
    });
    setCombinationPrices(updated);
    setBatchPriceInput("");
  };

  const handleUpdateCombinationPrice = (key, val) => {
    setCombinationPrices((prev) => ({ ...prev, [key]: val }));
  };

  const handleApplyBatchStock = (combosList) => {
    if (batchStockInput === "" || isNaN(batchStockInput)) {
      alert("Vui lòng nhập số lượng tồn kho hợp lệ!");
      return;
    }
    const s = Math.max(0, parseInt(batchStockInput, 10) || 0);
    const updated = { ...combinationStocks };
    combosList.forEach((c) => {
      updated[c.key] = s;
    });
    setCombinationStocks(updated);
    setBatchStockInput("");
  };

  const handleUpdateCombinationStock = (key, val) => {
    setCombinationStocks((prev) => ({ ...prev, [key]: val }));
  };

  const handleUpdateCombinationOrigPrice = (key, val) => {
    setCombinationOrigPrices((prev) => ({ ...prev, [key]: val }));
    const isDisc = combinationDiscounts[key];
    if (isDisc === false) {
      setCombinationPrices((prev) => ({ ...prev, [key]: val }));
    }
  };

  const handleUpdateCombinationPercent = (key, val, origVal) => {
    const orig = origVal !== "" && origVal !== undefined ? Number(origVal) : (Number(price) || 0);
    if (val === "" || isNaN(val)) {
      setCombinationPrices((prev) => ({ ...prev, [key]: orig }));
      return;
    }
    const pct = Math.min(99, Math.max(1, Number(val) || 0));
    const sale = Math.round(orig * (1 - pct / 100));
    setCombinationPrices((prev) => ({ ...prev, [key]: sale }));
  };

  const handleToggleCombinationDiscount = (key, enabled, origVal) => {
    setCombinationDiscounts((prev) => ({ ...prev, [key]: enabled }));
    const orig = origVal !== "" && origVal !== undefined ? Number(origVal) : (Number(originalPrice) || Number(price) || 0);
    if (!enabled) {
      setCombinationPrices((prev) => ({ ...prev, [key]: orig }));
    } else {
      const currentP = combinationPrices[key] !== undefined ? Number(combinationPrices[key]) : orig;
      if (orig > currentP && currentP > 0) {
        // Giữ nguyên mức giá giảm đang có
      } else {
        const sale = Math.round(orig * 0.9);
        setCombinationPrices((prev) => ({ ...prev, [key]: sale }));
      }
    }
  };

  const handleApplyBatchDiscount = (combosList) => {
    const pct = Number(batchDiscountPctInput);
    if (!batchDiscountPctInput || isNaN(pct) || pct <= 0 || pct >= 100) {
      alert("Vui lòng nhập mức % giảm hợp lệ (từ 1 đến 99)!");
      return;
    }
    const newDiscs = { ...combinationDiscounts };
    const newPrices = { ...combinationPrices };
    combosList.forEach((c) => {
      newDiscs[c.key] = true;
      const orig = c.displayOrigPrice > 0 ? c.displayOrigPrice : (Number(price) || 0);
      newPrices[c.key] = Math.round(orig * (1 - pct / 100));
    });
    setCombinationDiscounts(newDiscs);
    setCombinationPrices(newPrices);
    setBatchDiscountPctInput("");
  };

  const handleSyncGlobalDiscountToVariants = (combosList) => {
    if (!hasDiscount || discountPercent <= 0) {
      alert("Vui lòng thiết lập mức giảm giá (% hoặc số tiền) ở Phần 1 trước khi đồng bộ!");
      return;
    }
    const newDiscs = { ...combinationDiscounts };
    const newPrices = { ...combinationPrices };
    combosList.forEach((c) => {
      newDiscs[c.key] = true;
      const orig = c.displayOrigPrice > 0 ? c.displayOrigPrice : (Number(originalPrice) || Number(price) || 0);
      const sale = Math.round(orig * (1 - discountPercent / 100));
      newPrices[c.key] = sale;
    });
    setCombinationDiscounts(newDiscs);
    setCombinationPrices(newPrices);
  };

  const handleApplyBatchOrigPrice = (combosList) => {
    if (batchOrigPriceInput === "" || isNaN(batchOrigPriceInput)) {
      alert("Vui lòng nhập giá gốc hợp lệ!");
      return;
    }
    const p = Math.max(0, Number(batchOrigPriceInput) || 0);
    const updated = { ...combinationOrigPrices };
    combosList.forEach((c) => {
      updated[c.key] = p;
    });
    setCombinationOrigPrices(updated);
    setBatchOrigPriceInput("");
  };

  // 4. Rich Description (Includes All Technical Specs & Highlights in Word format)
  const [desc, setDesc] = useState(product?.desc || "");

  // Submit Handler
  const handleSubmit = (e) => {
    e.preventDefault();
    try {
      if (!name.trim()) {
      alert("Vui lòng nhập tên sản phẩm!");
      return;
    }

    const primaryImg = img || gallery[0] || "src/assets/img/phone-iphone-16-pro.png";
    const finalGallery = gallery.length > 0 ? gallery : [primaryImg];

    // Xây dựng danh sách tổ hợp biến thể và nhóm phân loại (hỗ trợ N nhóm)
    const currentBasePrice = Number(price) || 0;
    let finalCombinations = [];
    const finalVariantGroups = [];

    if (hasVariants) {
      variantGroups.forEach((g) => {
        const validOptions = (g.options || []).filter((o) => o.name && o.name.trim());
        if (validOptions.length > 0) {
          finalVariantGroups.push({
            id: g.id || ("grp_" + Date.now()),
            name: (g.name || "").trim() || "Phân loại",
            options: validOptions,
          });
        }
      });

      if (finalVariantGroups.length > 0) {
        const groupOptions = finalVariantGroups.map((g) => g.options);
        const cartesianCombos = groupOptions.reduce(
          (acc, curr) => acc.flatMap((d) => curr.map((e) => [...d, e])),
          [[]]
        );

        finalCombinations = cartesianCombos.map((combo, idx) => {
          const names = combo.map((item) => item.name);
          const key = names.join(" · ");
          const comboImg = combo.find((item) => item.img)?.img || primaryImg;
          const diffSum = combo.reduce((sum, item) => sum + (Number(item.priceDiff) || 0), 0);
          let combPrice = combinationPrices[key];
          if (combPrice === undefined) {
            const foundV = product?.variants?.find((v) => v.name === key || (v.options && v.options.join(" · ") === key));
            if (foundV && foundV.priceDiff !== undefined) {
              combPrice = currentBasePrice + Number(foundV.priceDiff);
            } else if (foundV && foundV.price !== undefined && (!product.price || Number(product.price) === currentBasePrice)) {
              combPrice = Number(foundV.price);
            } else {
              combPrice = currentBasePrice + diffSum;
            }
          }

          let rawStock = combinationStocks[key];
          let combStock = 10;
          if (rawStock !== undefined && rawStock !== "") {
            combStock = Math.max(0, parseInt(rawStock, 10) || 0);
          } else {
            const foundV = product?.variants?.find((v) => v.name === key || (v.options && v.options.join(" · ") === key));
            if (foundV && foundV.stock !== undefined) {
              combStock = Math.max(0, parseInt(foundV.stock, 10) || 0);
            }
          }

          // Cờ áp dụng giảm giá riêng cho biến thể
          let combHasDiscount = combinationDiscounts[key];
          if (combHasDiscount === undefined) {
            const foundV = product?.variants?.find((v) => v.name === key || (v.options && v.options.join(" · ") === key));
            if (!product?.hasDiscount && hasDiscount) {
              combHasDiscount = true;
            } else if (foundV && foundV.hasDiscount !== undefined) {
              combHasDiscount = Boolean(foundV.hasDiscount);
            } else {
              combHasDiscount = Boolean(hasDiscount);
            }
          }

          // Giá niêm yết gốc của biến thể
          const currentBaseOrig = (hasDiscount && Number(originalPrice) > 0) ? Number(originalPrice) : currentBasePrice;
          let rawOrigPrice = combinationOrigPrices[key];
          let combOrigPrice = currentBasePrice;
          if (rawOrigPrice !== undefined && rawOrigPrice !== "") {
            combOrigPrice = Number(rawOrigPrice) || (currentBaseOrig + diffSum);
          } else {
            const foundV = product?.variants?.find((v) => v.name === key || (v.options && v.options.join(" · ") === key));
            if (foundV && (foundV.originalPrice !== undefined || foundV.giaGoc !== undefined)) {
              combOrigPrice = Number(foundV.originalPrice ?? foundV.giaGoc) || (currentBaseOrig + diffSum);
            } else {
              combOrigPrice = currentBaseOrig + diffSum;
            }
          }

          const numCombPrice = combPrice === "" ? currentBasePrice : Number(combPrice) || currentBasePrice;

          return {
            id: "comb_" + idx + "_" + combo.map((item) => item.id || "").join("_"),
            key,
            name: key,
            options: names,
            group1: names[0] || "",
            group2: names[1] || "",
            img: comboImg,
            originalPrice: combOrigPrice,
            hasDiscount: Boolean(combHasDiscount),
            price: numCombPrice,
            stock: combStock,
            priceDiff: numCombPrice - currentBasePrice,
          };
        });
      }
    }

    // Tinh toan gia dai dien san pham (Single Source of Truth tu bien the)
    let effectivePrice = Number(price) || 0;
    let effectiveOrigPrice = (hasDiscount && Number(originalPrice) > 0) ? Number(originalPrice) : null;
    let effectiveHasDiscount = Boolean(hasDiscount && effectiveOrigPrice && effectiveOrigPrice > effectivePrice);
    let effectiveDiscountAmount = effectiveHasDiscount ? (effectiveOrigPrice - effectivePrice) : 0;

    if (hasVariants && finalCombinations.length > 0) {
      // Ton trong 100% lua chon cua nguoi dung o bang bien the (khong ghi de bien the 1)
      const minComb = finalCombinations.reduce((min, c) => (c.price < min.price ? c : min), finalCombinations[0]);
      effectivePrice = minComb.price;
      effectiveOrigPrice = minComb.originalPrice || minComb.price;
      effectiveHasDiscount = finalCombinations.some((c) => c.hasDiscount);
      effectiveDiscountAmount = effectiveHasDiscount && effectiveOrigPrice > effectivePrice ? (effectiveOrigPrice - effectivePrice) : 0;
    }

    const BRAND_MAP = {
      apple: "Apple", samsung: "Samsung", xiaomi: "Xiaomi", oppo: "OPPO",
      sony: "Sony", marshall: "Marshall", anker: "Anker", other: "Khác"
    };
    const CAT_MAP = {
      phones: "Điện thoại", laptops: "Laptop", tablets: "Máy tính bảng",
      audio: "Âm thanh", watches: "Đồng hồ", accessories: "Phụ kiện"
    };

    onSave({
      ...product,
      name: name.trim(),
      fullName: (fullName.trim() || name.trim()),
      ten: name.trim(),
      tenDayDu: (fullName.trim() || name.trim()),
      brand,
      brandLabel: BRAND_MAP[brand] || brand,
      tenThuongHieu: BRAND_MAP[brand] || brand,
      category,
      categoryLabel: CAT_MAP[category] || category,
      tenDanhMuc: CAT_MAP[category] || category,
      hasDiscount: effectiveHasDiscount,
      price: effectivePrice,
      giaBan: effectivePrice,
      originalPrice: effectiveOrigPrice,
      giaGoc: effectiveOrigPrice,
      discountAmount: effectiveDiscountAmount,
      giamTruTrucTiep: effectiveDiscountAmount,
      isInstallment: isInstallment ? 1 : 0,
      img: primaryImg,
      gallery: finalGallery,
      stock: (hasVariants && finalCombinations.length > 0)
        ? finalCombinations.reduce((sum, c) => sum + (Number(c.stock) || 0), 0)
        : (Number(stock) || 0),
      ton_kho: (hasVariants && finalCombinations.length > 0)
        ? finalCombinations.reduce((sum, c) => sum + (Number(c.stock) || 0), 0)
        : (Number(stock) || 0),
      status,
      badge: badge.trim(),
      huyHieu: badge.trim(),
      gift: gift.trim(),
      quaTang: gift.trim(),
      specsShort: specsShort.trim(),
      thongSoNgan: specsShort.trim(),
      coTraGop: isInstallment ? 1 : 0,
      hinhAnh: primaryImg,
      albumAnh: finalGallery,
      tonKho: (hasVariants && finalCombinations.length > 0)
        ? finalCombinations.reduce((sum, c) => sum + (Number(c.stock) || 0), 0)
        : (Number(stock) || 0),
      variants: hasVariants ? finalCombinations : [],
      variantGroups: hasVariants ? finalVariantGroups : [],
      colors: hasVariants && finalVariantGroups[0] ? finalVariantGroups[0].options.map((o) => ({ id: o.id, name: o.name, img: o.img })) : [],
      storageOptions: hasVariants && finalVariantGroups[1] ? finalVariantGroups[1].options.map((o) => ({ id: o.id, label: o.name, priceDiff: 0 })) : [],
      variantGroupName: hasVariants && finalVariantGroups[0] ? finalVariantGroups[0].name : "",
      variantGroup2Name: hasVariants && finalVariantGroups[1] ? finalVariantGroups[1].name : "",
      specsDetailed: product?.specsDetailed || {},
      thongSoKyThuat: product?.thongSoKyThuat || {},
      status: status || "active",
      trangThai: status || "active",
      desc: desc.trim(),
      baiVietMoTa: desc.trim(),
    });
    } catch (err) {
      console.error("[ProductFormModal] Lỗi submit form:", err);
      alert("Đã xảy ra lỗi khi chuẩn bị dữ liệu cập nhật: " + err.message);
    }
  };

  const numPrice = Number(price) || 0;
  const numOrig = hasDiscount ? (Number(originalPrice) || 0) : 0;
  const numDisc = hasDiscount ? (Number(discountAmount) || 0) : 0;
  const discountPercent = hasDiscount && numOrig > numPrice && numOrig > 0 ? Math.round(((numOrig - numPrice) / numOrig) * 100) : 0;

  return (
    <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-4">
      <div className="bg-white rounded-2xl w-full max-w-5xl max-h-[94vh] flex flex-col shadow-2xl animate-in zoom-in-95 duration-150 border border-[#E5E8EC]">
        
        {/* Header (Cohesive Single-Page Form) */}
        <div className="p-5 border-b border-[#E5E8EC] flex items-center justify-between bg-white rounded-t-2xl">
          <div>
            <h3 className="font-extrabold text-base text-[#141923] flex items-center gap-2">
              <Icon name="package" className="w-5 h-5 text-[#0275A9]" />
              <span>{isEditing ? `Chỉnh sửa: ${product.name}` : "Thêm sản phẩm mới"}</span>
            </h3>
            <p className="text-xs text-[#707783] mt-0.5">
              Form quản lý sản phẩm nhất quán trên 1 trang duy nhất: Thông tin, Giá bán, Biến thể và Bài viết mô tả.
            </p>
          </div>
          <button
            onClick={onClose}
            className="p-2 text-[#707783] hover:text-[#141923] hover:bg-[#F5F6F8] rounded-xl transition cursor-pointer"
          >
            <Icon name="x" className="w-5 h-5" />
          </button>
        </div>

        {/* Form Body: Single-Page Scrollable Layout */}
        <form onSubmit={handleSubmit} className="flex-1 overflow-y-auto p-6 space-y-8">
          
          {/* =========================================================================
              PHẦN 1: THÔNG TIN CƠ BẢN, GIÁ BÁN & CHÍNH SÁCH
              ========================================================================= */}
          <div className="bg-[#F8FAFC] border border-[#E5E8EC] rounded-2xl p-5 space-y-5">
            <div className="flex items-center gap-2 border-b border-[#E5E8EC] pb-3">
              <span className="w-6 h-6 rounded-lg bg-[#0275A9] text-white flex items-center justify-center text-xs font-black">1</span>
              <h4 className="font-extrabold text-sm text-[#141923]">Thông tin cơ bản & Giá bán thương mại</h4>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              {/* Cột Trái: Tên, Hãng, Danh mục, Badge */}
              <div className="space-y-4">
                <div>
                  <label className="block text-[#141923] font-bold text-xs uppercase tracking-wider mb-1.5">
                    Tên sản phẩm (Ngắn gọn) *
                  </label>
                  <input
                    type="text"
                    required
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    placeholder="Ví dụ: iPhone 16 Pro"
                    className="w-full px-4 py-2.5 text-xs font-bold border border-[#CBD5E1] rounded-xl focus:border-[#0275A9] focus:outline-none bg-white"
                  />
                </div>

                <div>
                  <label className="block text-[#141923] font-bold text-xs uppercase tracking-wider mb-1.5">
                    Tên hiển thị đầy đủ trang chi tiết (Full Name)
                  </label>
                  <input
                    type="text"
                    value={fullName}
                    onChange={(e) => setFullName(e.target.value)}
                    placeholder="Ví dụ: Apple iPhone 16 Pro Chính Hãng VN/A"
                    className="w-full px-4 py-2.5 text-xs font-bold border border-[#CBD5E1] rounded-xl focus:border-[#0275A9] focus:outline-none bg-white"
                  />
                  <p className="text-[11px] text-[#707783] mt-1">Đồng bộ với tiêu đề trang chi tiết sản phẩm (PDP).</p>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[#141923] font-bold text-xs uppercase tracking-wider mb-1.5">
                      Thương hiệu *
                    </label>
                    <select
                      value={brand}
                      onChange={(e) => setBrand(e.target.value)}
                      className="w-full px-3 py-2.5 text-xs font-bold border border-[#CBD5E1] rounded-xl focus:border-[#0275A9] focus:outline-none bg-white"
                    >
                      <option value="apple">Apple</option>
                      <option value="samsung">Samsung</option>
                      <option value="xiaomi">Xiaomi</option>
                      <option value="oppo">OPPO</option>
                      <option value="sony">Sony</option>
                      <option value="marshall">Marshall</option>
                      <option value="anker">Anker</option>
                      <option value="other">Thương hiệu khác</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-[#141923] font-bold text-xs uppercase tracking-wider mb-1.5">
                      Danh mục *
                    </label>
                    <select
                      value={category}
                      onChange={(e) => setCategory(e.target.value)}
                      className="w-full px-3 py-2.5 text-xs font-bold border border-[#CBD5E1] rounded-xl focus:border-[#0275A9] focus:outline-none bg-white"
                    >
                      <option value="phones">📱 Điện thoại</option>
                      <option value="laptops">💻 Laptop</option>
                      <option value="tablets">📱 Máy tính bảng</option>
                      <option value="audio">🎧 Âm thanh / Tai nghe</option>
                      <option value="watches">⌚ Đồng hồ thông minh</option>
                      <option value="accessories">🔌 Phụ kiện công nghệ</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label className="block text-[#141923] font-bold text-xs uppercase tracking-wider mb-1.5">
                    Huy hiệu sản phẩm (Badge)
                  </label>
                  <input
                    type="text"
                    value={badge}
                    onChange={(e) => setBadge(e.target.value)}
                    placeholder="VD: TRẢ GÓP 0%, HOT DEAL, BÁN CHẠY, MỚI RA MẮT..."
                    className="w-full px-3 py-2 text-xs border border-[#CBD5E1] rounded-xl focus:border-[#0275A9] focus:outline-none bg-white"
                  />
                  <div className="flex flex-wrap gap-1.5 mt-1.5">
                    {["TRẢ GÓP 0%", "HOT DEAL", "BÁN CHẠY", "MỚI RA MẮT"].map((b) => (
                      <button
                        key={b}
                        type="button"
                        onClick={() => setBadge(b)}
                        className="px-2 py-0.5 bg-white border border-[#CBD5E1] hover:border-[#0275A9] hover:text-[#0275A9] rounded text-[10px] font-semibold text-[#707783] transition cursor-pointer"
                      >
                        +{b}
                      </button>
                    ))}
                    <button
                      type="button"
                      onClick={() => setBadge("")}
                      className="px-2 py-0.5 bg-white border border-rose-200 text-rose-600 rounded text-[10px] font-semibold hover:bg-rose-50 transition cursor-pointer"
                    >
                      Xóa badge
                    </button>
                  </div>
                </div>

                <div>
                  <label className="block text-[#141923] font-bold text-xs uppercase tracking-wider mb-1.5">
                    Quà tặng kèm theo (Gift)
                  </label>
                  <input
                    type="text"
                    value={gift}
                    onChange={(e) => setGift(e.target.value)}
                    placeholder="Ví dụ: Tặng gói bảo hành VIP 12 tháng, hoặc Tặng củ sạc 45W..."
                    className="w-full px-4 py-2.5 text-xs border border-[#CBD5E1] rounded-xl focus:border-[#0275A9] focus:outline-none bg-white"
                  />
                </div>

                <div>
                  <label className="block text-[#141923] font-bold text-xs uppercase tracking-wider mb-1.5">
                    Thông số tóm tắt ngắn (Specs Short)
                  </label>
                  <input
                    type="text"
                    value={specsShort}
                    onChange={(e) => setSpecsShort(e.target.value)}
                    placeholder="Ví dụ: Apple A18 Pro · Super Retina XDR 120Hz · Fusion 48MP"
                    className="w-full px-4 py-2.5 text-xs border border-[#CBD5E1] rounded-xl focus:border-[#0275A9] focus:outline-none bg-white"
                  />
                </div>
              </div>

              {/* Cột Phải: Giá & Khuyến mãi (Sản phẩm đơn) HOẶC Thông báo biến thể (Sản phẩm có biến thể) */}
              <div className="space-y-4">
                {hasVariants ? (
                  <div className="p-4 bg-[#EAF4FA]/70 border border-[#0275A9]/30 rounded-xl space-y-2.5 shadow-2xs">
                    <div className="flex items-center gap-2 text-[#0275A9]">
                      <span className="text-base font-black">ℹ️</span>
                      <h5 className="font-extrabold text-xs uppercase tracking-wider">
                        Sản phẩm có biến thể phân loại
                      </h5>
                    </div>
                    <p className="text-xs text-[#334155] leading-relaxed">
                      Giá niêm yết gốc, chương trình giảm giá và số lượng tồn kho được quản lý chi tiết theo từng phiên bản ở <span className="font-bold text-[#0275A9]">Phần 3 (Bảng phân loại hàng)</span> bên dưới.
                    </p>
                    <div className="pt-2 border-t border-[#0275A9]/15 flex items-center justify-between text-xs">
                      <span className="text-[#64748B] font-medium">Tổng tồn kho tự động:</span>
                      <span className="font-black text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">
                        {Object.values(combinationStocks).reduce((sum, s) => sum + (s === "" ? 0 : (Math.max(0, parseInt(s, 10)) || 0)), 0)} máy
                      </span>
                    </div>
                  </div>
                ) : (
                  <div className="p-4 bg-white rounded-xl border border-[#E5E8EC] space-y-3.5 shadow-2xs">
                    {/* 1. Ô nhập Giá bán thực tế */}
                    <div>
                      <label className="block text-[#0275A9] font-black text-xs uppercase tracking-wider mb-1 flex items-center justify-between">
                        <span>Giá bán thực tế (Khách thanh toán) *</span>
                        <span className="text-[#0275A9] font-black text-xs truncate">
                          = {formatVND(numPrice)}
                        </span>
                      </label>
                      <input
                        type="number"
                        min="0"
                        step="1000"
                        required
                        value={price}
                        onChange={(e) => handlePriceChange(e.target.value)}
                        placeholder="Nhập giá bán thực tế..."
                        className="w-full px-3.5 py-2.5 text-xs font-black border-2 border-[#0275A9] rounded-xl focus:outline-none bg-[#EAF4FA]/40 text-[#0275A9]"
                      />
                    </div>

                    {/* 2. Giảm giá cho sản phẩm đơn */}
                    <div className="pt-2 border-t border-[#F1F3F5]">
                      <div className="flex items-center justify-between mb-2">
                        <label className="flex items-center gap-2 cursor-pointer">
                          <input
                            type="checkbox"
                            checked={hasDiscount}
                            onChange={(e) => handleToggleDiscount(e.target.checked)}
                            className="w-4 h-4 text-[#0275A9] rounded border-[#CBD5E1] focus:ring-[#0275A9] cursor-pointer"
                          />
                          <span className="font-bold text-xs text-[#141923] uppercase">
                            Áp dụng giảm giá (Khuyến mãi)
                          </span>
                        </label>
                        {hasDiscount && numDisc > 0 ? (
                          <span className="px-2.5 py-0.5 bg-rose-100 text-rose-700 rounded-full font-bold text-xs">
                            Tiết kiệm {formatVND(numDisc)} (-{discountPercent}%)
                          </span>
                        ) : (
                          <span className="px-2 py-0.5 bg-slate-100 text-slate-600 rounded font-bold text-[10px]">
                            Bán đúng giá niêm yết
                          </span>
                        )}
                      </div>

                      {hasDiscount ? (
                        <div className="space-y-3 bg-rose-50/20 p-3 rounded-xl border border-rose-200 animate-in fade-in duration-150">
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                              <label className="block text-[#707783] font-bold text-[11px] uppercase mb-1">
                                Giá niêm yết gốc (Gạch ngang)
                              </label>
                              <input
                                type="number"
                                min="0"
                                step="1000"
                                value={originalPrice}
                                onChange={(e) => handleOriginalPriceChange(e.target.value)}
                                placeholder="VD: 500000..."
                                className="w-full px-3 py-2 text-xs font-bold border border-[#CBD5E1] rounded-xl focus:border-[#0275A9] focus:outline-none bg-white text-[#141923]"
                              />
                              <div className="text-[11px] text-[#707783] line-through mt-0.5 truncate">
                                = {formatVND(numOrig)}
                              </div>
                            </div>

                            <div>
                              <label className="block text-[#707783] font-bold text-[11px] uppercase mb-1 flex items-center justify-between">
                                <span>Mức giảm %</span>
                                <span className="text-[#0275A9] lowercase text-[10px] font-normal">nhập %</span>
                              </label>
                              <div className="relative">
                                <input
                                  type="number"
                                  min="1"
                                  max="99"
                                  step="1"
                                  value={customPercent}
                                  onChange={(e) => handlePercentInputChange(e.target.value)}
                                  placeholder="VD: 10, 20..."
                                  className="w-full pl-3 pr-8 py-2 text-xs font-bold border border-rose-300 rounded-xl focus:border-rose-600 focus:outline-none bg-white text-rose-700"
                                />
                                <span className="absolute right-3 top-2 text-xs font-bold text-rose-600">%</span>
                              </div>
                            </div>
                          </div>
                        </div>
                      ) : (
                        <div className="p-3 bg-[#F8FAFC] rounded-xl border border-dashed border-[#CBD5E1] text-xs text-[#707783]">
                          Sản phẩm bán đúng giá niêm yết gốc (không gạch ngang).
                        </div>
                      )}
                    </div>
                  </div>
                )}

                {/* Trả góp 0% Switch */}
                <div className="p-3.5 bg-white rounded-xl border border-[#E5E8EC] shadow-2xs">
                  <label className="flex items-start gap-3 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={isInstallment}
                      onChange={(e) => setIsInstallment(e.target.checked)}
                      className="mt-0.5 w-4 h-4 text-[#0275A9] rounded border-[#CBD5E1] focus:ring-[#0275A9] cursor-pointer"
                    />
                    <div>
                      <div className="font-bold text-xs text-[#141923]">
                        Hỗ trợ trả góp 0% qua thẻ tín dụng (is_installment)
                      </div>
                      <p className="text-[11px] text-[#707783] mt-0.5">
                        Khi bật: Hiển thị nhãn TRẢ GÓP 0% và nút tính lãi suất trả góp trên trang sản phẩm.
                      </p>
                    </div>
                  </label>
                </div>

                {/* Tồn kho & Trạng thái kinh doanh */}
                <div className={hasVariants ? "space-y-3" : "grid grid-cols-2 gap-3"}>
                  {!hasVariants && (
                    <div className="p-3 bg-white rounded-xl border border-[#E5E8EC]">
                      <label className="block text-[#141923] font-bold text-[11px] uppercase mb-1">
                        Số lượng tồn kho *
                      </label>
                      <input
                        type="number"
                        min="0"
                        required
                        value={stock}
                        onChange={(e) => setStock(e.target.value)}
                        className="w-full px-3 py-1.5 text-xs font-bold border rounded-lg focus:outline-none border-[#CBD5E1] focus:border-[#0275A9] bg-white font-mono"
                      />
                    </div>
                  )}

                  <div className="p-3 bg-white rounded-xl border border-[#E5E8EC]">
                    <label className="block text-[#141923] font-bold text-[11px] uppercase mb-1">
                      Trạng thái bán
                    </label>
                    <select
                      value={status}
                      onChange={(e) => setStatus(e.target.value)}
                      className="w-full px-2.5 py-1.5 text-xs font-bold border border-[#CBD5E1] rounded-lg focus:border-[#0275A9] focus:outline-none bg-white"
                    >
                      <option value="active">🟢 Đang bán</option>
                      <option value="inactive">⚪ Tạm ẩn</option>
                    </select>
                    <p className="text-[10px] text-[#707783] mt-1">
                      {status === "active" ? "Hiển thị công khai" : "Ẩn khỏi cửa hàng"}
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* =========================================================================
              PHẦN 2: HÌNH ẢNH SẢN PHẨM (ĐẠI DIỆN & THƯ VIỆN)
              ========================================================================= */}
          <div className="bg-[#F8FAFC] border border-[#E5E8EC] rounded-2xl p-5 space-y-4">
            <div className="flex items-center justify-between border-b border-[#E5E8EC] pb-3">
              <div className="flex items-center gap-2">
                <span className="w-6 h-6 rounded-lg bg-[#0275A9] text-white flex items-center justify-center text-xs font-black">2</span>
                <h4 className="font-extrabold text-sm text-[#141923]">Hình ảnh sản phẩm & Bộ sưu tập ({gallery.length} ảnh)</h4>
              </div>
              <span className="text-xs text-[#707783]">Click ảnh để đặt làm ảnh đại diện chính</span>
            </div>

            {/* Gallery Thumbnails List */}
            <div className="flex flex-wrap gap-3 items-center">
              {gallery.map((gImg, idx) => {
                const isPrimary = img === gImg;
                return (
                  <div
                    key={idx}
                    className={`relative w-24 h-24 rounded-xl border-2 p-1.5 bg-white transition group flex items-center justify-center ${
                      isPrimary ? "border-[#0275A9] shadow-md ring-2 ring-[#0275A9]/20" : "border-[#E5E8EC] hover:border-[#CBD5E1]"
                    }`}
                  >
                    <img
                      src={gImg}
                      alt=""
                      onClick={() => setImg(gImg)}
                      className="w-full h-full object-contain cursor-pointer"
                    />
                    {isPrimary ? (
                      <span className="absolute top-1 left-1 bg-[#0275A9] text-white text-[9px] font-extrabold px-1.5 py-0.2 rounded shadow-2xs">
                        Chính
                      </span>
                    ) : (
                      <button
                        type="button"
                        onClick={() => setImg(gImg)}
                        className="absolute bottom-1 inset-x-1 text-[9px] bg-[#141923]/80 hover:bg-[#0275A9] text-white font-bold py-0.5 rounded opacity-0 group-hover:opacity-100 transition cursor-pointer text-center"
                      >
                        Đặt chính
                      </button>
                    )}
                    <button
                      type="button"
                      onClick={() => handleRemoveImage(idx)}
                      className="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-rose-500 hover:bg-rose-700 text-white flex items-center justify-center text-xs shadow-md opacity-0 group-hover:opacity-100 transition cursor-pointer"
                      title="Xóa ảnh này"
                    >
                      ×
                    </button>
                  </div>
                );
              })}

              {/* Upload Button */}
              <label className="w-24 h-24 rounded-xl border-2 border-dashed border-[#CBD5E1] hover:border-[#0275A9] hover:bg-[#EAF4FA]/40 bg-white flex flex-col items-center justify-center text-center p-2 cursor-pointer transition">
                <Icon name="upload" className="w-5 h-5 text-[#0275A9] mb-1" />
                <span className="text-[10px] font-bold text-[#141923]">+ Tải ảnh</span>
                <span className="text-[9px] text-[#707783]">Max 2MB</span>
                <input
                  type="file"
                  multiple
                  accept="image/*"
                  onChange={handleMultipleFileUpload}
                  className="hidden"
                />
              </label>
            </div>

            {/* Custom URL Input & Preset Images Bar */}
            <div className="pt-2 flex flex-col sm:flex-row items-center gap-3">
              <div className="flex-1 flex gap-2 w-full">
                <input
                  type="text"
                  value={customUrl}
                  onChange={(e) => setCustomUrl(e.target.value)}
                  placeholder="Dán đường dẫn ảnh trực tuyến (https://...)"
                  className="flex-1 px-3 py-1.5 text-xs border border-[#CBD5E1] rounded-xl focus:border-[#0275A9] focus:outline-none bg-white"
                />
                <button
                  type="button"
                  onClick={handleAddCustomUrl}
                  className="px-4 py-1.5 bg-white border border-[#CBD5E1] hover:border-[#0275A9] text-[#141923] text-xs font-bold rounded-xl transition cursor-pointer shrink-0"
                >
                  Thêm URL
                </button>
              </div>

              {/* Presets Quick Pick */}
              <div className="flex items-center gap-1.5 overflow-x-auto w-full sm:w-auto">
                <span className="text-[11px] text-[#707783] shrink-0 font-medium">Kho ảnh mẫu:</span>
                {presetImages.map((preset) => (
                  <button
                    key={preset.path}
                    type="button"
                    onClick={() => handleAddPreset(preset.path)}
                    className="p-1 rounded-lg border border-[#E5E8EC] hover:border-[#0275A9] bg-white shrink-0 cursor-pointer"
                    title={preset.name}
                  >
                    <img src={preset.path} alt="" className="w-6 h-6 object-contain" />
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* =========================================================================
              PHẦN 3: PHÂN LOẠI HÀNG / BIẾN THỂ (KHÔNG GIỚI HẠN SỐ NHÓM, CHỨC NĂNG ĐỒNG NHẤT: ẢNH + CHỮ)
              ========================================================================= */}
          <div className="bg-[#F8FAFC] border border-[#E5E8EC] rounded-2xl p-5 space-y-5">
            <div className="flex items-center justify-between border-b border-[#E5E8EC] pb-3">
              <div className="flex items-center gap-2">
                <span className="w-6 h-6 rounded-lg bg-[#0275A9] text-white flex items-center justify-center text-xs font-black">3</span>
                <div>
                  <h4 className="font-extrabold text-sm text-[#141923]">Phân loại hàng / Biến thể (Tùy chọn)</h4>
                  <p className="text-[11px] text-[#707783]">Thêm không giới hạn nhóm phân loại (Màu sắc, Dung lượng, Kích cỡ, Công suất, Bảo hành...). Các nhóm có chức năng hoàn toàn giống nhau (Ảnh + Chữ).</p>
                </div>
              </div>
              <label className="flex items-center gap-2 cursor-pointer bg-white px-3 py-1.5 rounded-xl border border-[#CBD5E1]">
                <input
                  type="checkbox"
                  checked={hasVariants}
                  onChange={(e) => setHasVariants(e.target.checked)}
                  className="w-4 h-4 text-[#0275A9] rounded border-[#CBD5E1] focus:ring-[#0275A9] cursor-pointer"
                />
                <span className="text-xs font-bold text-[#141923]">Sản phẩm có nhiều phân loại</span>
              </label>
            </div>

            {hasVariants && (() => {
              // Tính toán tổ hợp động từ các nhóm hợp lệ
              const validGroups = variantGroups.filter((g) => (g.name || "").trim() && g.options.some((o) => (o.name || "").trim()));
              const groupOptions = validGroups.map((g) => g.options.filter((o) => (o.name || "").trim()));
              
              const liveCombos = validGroups.length > 0 ? groupOptions.reduce(
                (acc, curr) => acc.flatMap((d) => curr.map((e) => [...d, e])),
                [[]]
              ).map((combo, idx) => {
                const names = combo.map((item) => item.name);
                const key = names.join(" · ");
                const comboImg = combo.find((item) => item.img)?.img || (img || (gallery && gallery[0]) || "");
                const foundV = product?.variants?.find((v) => v.name === key || (v.options && v.options.join(" · ") === key));

                // 1. Giá niêm yết gốc của biến thể
                let rawOrigPrice = combinationOrigPrices[key];
                let vOrigPrice;
                if (rawOrigPrice !== undefined) {
                  vOrigPrice = rawOrigPrice;
                } else if (foundV && (foundV.originalPrice !== undefined || foundV.giaGoc !== undefined)) {
                  vOrigPrice = foundV.originalPrice ?? foundV.giaGoc;
                } else {
                  const diffSum = combo.reduce((sum, item) => sum + (Number(item.priceDiff) || 0), 0);
                  vOrigPrice = (numOrig || numPrice) + diffSum;
                }

                // 2. Trạng thái giảm giá của biến thể
                let rawDisc = combinationDiscounts[key];
                let vHasDiscount;
                if (rawDisc !== undefined) {
                  vHasDiscount = Boolean(rawDisc);
                } else if (foundV && foundV.hasDiscount !== undefined) {
                  vHasDiscount = Boolean(foundV.hasDiscount);
                } else {
                  vHasDiscount = Boolean(hasDiscount);
                }

                // 3. Giá bán thực tế của biến thể
                let rawPrice = combinationPrices[key];
                let vPrice;
                if (rawPrice !== undefined) {
                  vPrice = rawPrice;
                } else if (foundV && foundV.price !== undefined) {
                  vPrice = foundV.price;
                } else {
                  const diffSum = combo.reduce((sum, item) => sum + (Number(item.priceDiff) || 0), 0);
                  vPrice = vHasDiscount ? (numPrice + diffSum) : ((numOrig || numPrice) + diffSum);
                }

                // 4. Tồn kho của biến thể
                let rawStock = combinationStocks[key];
                let vStock;
                if (rawStock !== undefined) {
                  vStock = rawStock;
                } else if (foundV && foundV.stock !== undefined) {
                  vStock = foundV.stock;
                } else {
                  vStock = 10;
                }

                const displayOrigPrice = vOrigPrice === "" ? 0 : Number(vOrigPrice);
                const displayPrice = vPrice === "" ? 0 : Number(vPrice);
                const displayStock = vStock === "" ? 0 : (Math.max(0, parseInt(vStock, 10)) || 0);

                return {
                  id: "comb_" + idx,
                  key,
                  name: key,
                  options: names,
                  img: comboImg,
                  originalPrice: vOrigPrice,
                  displayOrigPrice,
                  hasDiscount: vHasDiscount,
                  price: vPrice,
                  displayPrice,
                  stock: vStock,
                  displayStock,
                  priceDiff: displayPrice - numPrice,
                };
              }) : [];

              return (
                <div className="space-y-6 animate-in fade-in duration-200">
                  {/* DANH SÁCH CÁC NHÓM PHÂN LOẠI (CHỨC NĂNG HOÀN TOÀN GIỐNG NHAU) */}
                  <div className="space-y-4">
                    {variantGroups.map((group, grpIdx) => (
                      <div key={group.id || grpIdx} className="p-4 bg-white border border-[#E5E8EC] rounded-xl space-y-3 shadow-2xs">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-[#E5E8EC] pb-2.5">
                          <div className="flex items-center gap-2 flex-1">
                            <span className="px-2.5 py-0.5 bg-[#EAF4FA] text-[#0275A9] font-black text-xs rounded-md">
                              Nhóm {grpIdx + 1}
                            </span>
                            <label className="text-xs font-bold text-[#707783] shrink-0">Tên nhóm:</label>
                            <input
                              type="text"
                              value={group.name}
                              onChange={(e) => handleUpdateGroupName(grpIdx, e.target.value)}
                              placeholder="VD: Màu sắc, Dung lượng, Kích cỡ, Công suất, Bảo hành..."
                              className="w-full max-w-xs px-2.5 py-1 text-xs font-bold text-[#141923] border border-[#CBD5E1] rounded-lg focus:border-[#0275A9] focus:outline-none bg-[#F8FAFC]"
                            />
                          </div>
                          <div className="flex items-center gap-2 self-start sm:self-center">
                            <button
                              type="button"
                              onClick={() => handleAddOption(grpIdx)}
                              className="px-3 py-1.5 bg-[#0275A9] hover:bg-[#02628e] text-white text-xs font-bold rounded-lg transition cursor-pointer flex items-center gap-1 shadow-2xs"
                            >
                              <Icon name="plus" className="w-3.5 h-3.5" />
                              <span>Thêm lựa chọn</span>
                            </button>
                            {variantGroups.length > 1 && (
                              <button
                                type="button"
                                onClick={() => handleRemoveGroup(grpIdx)}
                                className="px-2.5 py-1.5 text-rose-600 hover:bg-rose-50 border border-rose-200 text-xs font-bold rounded-lg transition cursor-pointer"
                                title="Xóa nhóm phân loại này"
                              >
                                Xóa nhóm
                              </button>
                            )}
                          </div>
                        </div>

                        {/* Danh sách lựa chọn của nhóm này (Ảnh + Chữ đồng nhất) */}
                        <div className="space-y-2.5 max-h-72 overflow-y-auto pr-1">
                          {group.options.map((opt, optIdx) => (
                            <div key={opt.id || optIdx} className="p-2.5 bg-[#F8FAFC] border border-[#E5E8EC] rounded-lg flex items-center gap-2.5">
                              {/* Thumbnail xem trước ảnh */}
                              <div className="w-10 h-10 rounded-lg bg-white border border-[#CBD5E1] flex items-center justify-center shrink-0 overflow-hidden">
                                {opt.img ? (
                                  <img src={opt.img} alt={opt.name} className="w-full h-full object-contain p-0.5" onError={(e) => { e.target.style.display = 'none'; }} />
                                ) : (
                                  <Icon name="image" className="w-4 h-4 text-[#94A3B8]" />
                                )}
                              </div>

                              {/* Ô nhập URL ảnh */}
                              <div className="w-2/5 min-w-0">
                                <div className="flex items-center gap-1">
                                  <input
                                    type="text"
                                    value={opt.img || ""}
                                    onChange={(e) => handleUpdateOption(grpIdx, optIdx, "img", e.target.value)}
                                    placeholder="URL ảnh (tùy chọn)..."
                                    className="w-full px-2 py-1 text-xs border border-[#CBD5E1] rounded-lg focus:border-[#0275A9] focus:outline-none bg-white"
                                  />
                                  {gallery && gallery.length > 0 && (
                                    <button
                                      type="button"
                                      onClick={() => {
                                        const nextImg = gallery[optIdx % gallery.length] || gallery[0];
                                        handleUpdateOption(grpIdx, optIdx, "img", nextImg);
                                      }}
                                      className="px-2 py-1 text-[10px] font-semibold text-[#0275A9] hover:bg-[#EAF4FA] border border-[#CBD5E1] rounded-lg transition shrink-0 cursor-pointer"
                                      title="Lấy ảnh từ thư viện sản phẩm"
                                    >
                                      Mẫu
                                    </button>
                                  )}
                                </div>
                              </div>

                              {/* Ô nhập tên lựa chọn (Chữ) */}
                              <div className="flex-1 min-w-0">
                                <input
                                  type="text"
                                  value={opt.name}
                                  onChange={(e) => handleUpdateOption(grpIdx, optIdx, "name", e.target.value)}
                                  placeholder="Tên lựa chọn (VD: Titan Sa Mạc, 128 GB, 65W, Size L...)"
                                  className="w-full px-2.5 py-1 text-xs font-bold border border-[#CBD5E1] rounded-lg focus:border-[#0275A9] focus:outline-none bg-white"
                                />
                              </div>

                              {/* Nút xóa lựa chọn */}
                              <button
                                type="button"
                                onClick={() => handleRemoveOption(grpIdx, optIdx)}
                                className="p-1 text-rose-500 hover:text-rose-700 hover:bg-rose-50 rounded transition cursor-pointer shrink-0"
                                title="Xóa lựa chọn này"
                              >
                                <Icon name="trash-2" className="w-4 h-4" />
                              </button>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* NÚT THÊM NHÓM MỚI (KHÔNG GIỚI HẠN SỐ NHÓM) */}
                  <div className="text-center py-2">
                    <button
                      type="button"
                      onClick={handleAddGroup}
                      className="px-5 py-2.5 bg-white hover:bg-[#EAF4FA] text-[#0275A9] border-2 border-dashed border-[#0275A9]/40 hover:border-[#0275A9] text-xs font-extrabold rounded-xl transition cursor-pointer inline-flex items-center gap-2 shadow-2xs"
                    >
                      <Icon name="plus" className="w-4 h-4 text-[#0275A9]" />
                      <span>+ Thêm nhóm phân loại mới (Nhóm {variantGroups.length + 1})</span>
                    </button>
                  </div>

                  {/* BẢNG PHÂN LOẠI HÀNG: GIÁ GỐC, TÙY CHỌN GIẢM GIÁ, GIÁ BÁN & TỒN KHO */}
                  {(() => {

function AdminApp() {

  });
  const [editingArticle, setEditingArticle] = useState(null);
