/**
 * Định dạng số tiền sang định dạng tiền tệ Việt Nam Đồng (VND)
 */
function formatVND(amount) {
  if (typeof amount !== 'number') {
    amount = Number(amount) || 0;
  }
  return new Intl.NumberFormat('vi-VN', {
    style: 'currency',
    currency: 'VND',
  }).format(amount);
}

/**
 * Tạo mã đơn hàng ngẫu nhiên duy nhất định dạng NET-XXXXX
 */
function generateOrderId() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let rand = '';
  for (let i = 0; i < 5; i++) {
    rand += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  return `NET-${rand}`;
}

/**
 * Tiện ích đọc localStorage an toàn với JSON serialization
 */
function getStorage(key, defaultValue) {
  try {
    const raw = localStorage.getItem(key);
    return raw !== null ? JSON.parse(raw) : defaultValue;
  } catch (err) {
    console.warn(`Error reading localStorage key "${key}":`, err);
    return defaultValue;
  }
}

/**
 * Tiện ích ghi localStorage an toàn với JSON serialization
 */
function setStorage(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (err) {
    console.warn(`Error writing to localStorage key "${key}":`, err);
  }
}

/**
 * Tạo URL ảnh mã VietQR thanh toán ngân hàng chuẩn Napas 247
 */
function generateVietQRUrl({
  bankId = 'MB',
  accountNo = '0901234567',
  accountName = 'NET STORE VN',
  amount = 0,
  memo = ''
}) {
  const encodedName = encodeURIComponent(accountName);
  const encodedMemo = encodeURIComponent(memo || 'THANH TOAN DON HANG NET');
  return `https://img.vietqr.io/image/${bankId}-${accountNo}-compact2.png?amount=${amount}&addInfo=${encodedMemo}&accountName=${encodedName}`;
}


/**
 * Kiểm tra và áp dụng mã giảm giá / voucher
 */
function applyCoupon(code, subtotal, shippingFee = 30000) {
  if (!code) return { valid: false, discountAmount: 0, message: 'Vui lòng nhập mã giảm giá' };
  
  const voucher = AVAILABLE_VOUCHERS.find((v) => v.code.toUpperCase() === code.trim().toUpperCase());
  if (!voucher) {
    return { valid: false, discountAmount: 0, message: 'Mã giảm giá không tồn tại hoặc đã hết hạn' };
  }

  if (subtotal < voucher.minOrder) {
    return {
      valid: false,
      discountAmount: 0,
      message: `Đơn hàng tối thiểu ${formatVND(voucher.minOrder)} để áp dụng mã này`,
    };
  }

  let discountAmount = 0;
  if (voucher.discountType === 'fixed') {
    discountAmount = voucher.value;
  } else if (voucher.discountType === 'shipping') {
    discountAmount = Math.min(shippingFee, voucher.value);
  } else if (voucher.discountType === 'percent') {
    discountAmount = Math.min(Math.round((subtotal * voucher.value) / 100), voucher.maxDiscount || Infinity);
  }

  return {
    valid: true,
    discountAmount,
    voucher,
    message: `Đã áp dụng mã ${voucher.code}: ${voucher.desc}`,
  };
}

/**
 * Phân tích hash route URL của trình duyệt thành route object
 * Hỗ trợ các trang: home, pdp, category, checkout, order-success, orders
 */
function parseRoute(hashString) {
  const hash = hashString ? hashString.replace(/^#\/?/, "") : "";
  if (!hash) return { page: "home" };

  const parts = hash.split("/");
  if (parts[0] === "product" && parts[1]) {
    return { page: "pdp", productId: parts[1] };
  }
  if (parts[0] === "category" && parts[1]) {
    return { page: "category", categorySlug: parts[1] };
  }
  if (parts[0] === "checkout") {
    return { page: "checkout" };
  }
  if (parts[0] === "order-success" && parts[1]) {
    return { page: "order-success", orderId: parts[1] };
  }
  if (parts[0] === "orders") {
    return { page: "orders" };
  }
  return { page: "home" };
}

/**
 * NÉT. API Client & Adapter Configuration
 * Switch between Local Mock / localStorage and Backend REST API (Node.js, FastAPI, Spring)
 */

const API_CONFIG = {
  // Bật kết nối Backend thật 100%
  USE_BACKEND_API: true,
  BASE_URL: 'http://localhost:5000/api',
  TIMEOUT_MS: 10000,
  HEADERS: {}
};

/**
 * Universal API Client Wrapper
 * Handles Authorization headers, status code checking, and timeout
 */
async function apiClient(endpoint, { method = 'GET', body = null, headers = {} } = {}) {
  if (!API_CONFIG.USE_BACKEND_API) {
    throw new Error('[API] Backend integration is currently turned off. Please enable API_CONFIG.USE_BACKEND_API.');
  }

  const token = localStorage.getItem('net_auth_token');
  const authHeaders = (token && method !== 'GET') ? { 'Authorization': `Bearer ${token}` } : {};

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), API_CONFIG.TIMEOUT_MS);

  // Chỉ gắn Content-Type khi có body (tránh kích hoạt preflight OPTIONS của Chrome trên file:///)
  const reqHeaders = {
    ...API_CONFIG.HEADERS,
    ...authHeaders,
    ...headers,
  };
  if (body && !reqHeaders['Content-Type']) {
    reqHeaders['Content-Type'] = 'application/json';
  }

  try {
    const response = await fetch(`${API_CONFIG.BASE_URL}${endpoint}`, {
      method,
      headers: reqHeaders,
      body: body ? JSON.stringify(body) : undefined,
      signal: controller.signal,
    });

    clearTimeout(timeoutId);

    if (!response.ok) {
      const errBody = await response.json().catch(() => ({}));
      const error = new Error(errBody.message || `Lỗi máy chủ HTTP ${response.status}`);
      error.status = response.status;
      error.data = errBody;
      throw error;
    }

    return await response.json();
  } catch (err) {
    clearTimeout(timeoutId);
    if (err.name === 'AbortError') {
      throw new Error(`Kết nối đến Backend quá thời gian chờ (${API_CONFIG.TIMEOUT_MS}ms)`);
    }
    throw err;
  }
}

      }
    }
    const found = INITIAL_PRODUCTS.find((p) => p.id === String(id));
    return Promise.resolve(found || null);
  },

   * Filter products by category slug
   */
  async getByCategory(slug) {
    if (API_CONFIG.USE_BACKEND_API) {
      try {
        const data = await apiClient(`/products?category=${encodeURIComponent(slug)}`);
        if (Array.isArray(data)) return data;
      } catch (err) {
        console.warn('[productService] Backend offline, filtering local products:', err);
      }
    }
    if (!slug || slug === 'all') return Promise.resolve(INITIAL_PRODUCTS);
    return Promise.resolve(INITIAL_PRODUCTS.filter((p) => p.category === slug));
  },

  /**
   * Live search query
   */
  async search(query, limit = 5) {
    if (API_CONFIG.USE_BACKEND_API) {
      try {
        const data = await apiClient(`/products/search?q=${encodeURIComponent(query)}&limit=${limit}`);
        if (Array.isArray(data)) return data;
      } catch (err) {
        console.warn('[productService] Backend offline, searching local products:', err);
      }
    }
    const q = (query || '').toLowerCase().trim();
    if (!q) return Promise.resolve([]);
    const matches = INITIAL_PRODUCTS.filter(
      (p) =>
        p.name.toLowerCase().includes(q) ||
        p.brand.toLowerCase().includes(q) ||
        (p.specsShort && p.specsShort.toLowerCase().includes(q))
    ).slice(0, limit);
    return Promise.resolve(matches);
  },

  /**
   * Get all category metadata
   */
  async getCategories() {
    if (API_CONFIG.USE_BACKEND_API) {
      try {
        const data = await apiClient('/categories');
        if (Array.isArray(data) && data.length > 0) return data;
      } catch (err) {
        console.warn('[productService] Backend offline, returning local categories:', err);
      }
    }
    return Promise.resolve(CATEGORIES);
  }
};

   * Create a new order

  async createOrder(orderPayload) {
    if (API_CONFIG.USE_BACKEND_API) {
      return await apiClient('/orders', {
        method: 'POST',
        body: orderPayload,
      });
    }

    const currentOrders = getStorage(ORDERS_STORAGE_KEY, []);
    const newOrder = {
      ...orderPayload,
      createdAt: new Date().toISOString(),
      status: orderPayload.paymentMethod === 'vietqr' ? 'Chờ thanh toán QR' : 'Đang xử lý',
    };
    const updated = [newOrder, ...currentOrders];
    setStorage(ORDERS_STORAGE_KEY, updated);
    return Promise.resolve(newOrder);
  },

  /**
   * Cancel an order with a reason
   */
  async cancelOrder(orderId, reason) {
    if (API_CONFIG.USE_BACKEND_API) {
      return await apiClient(`/orders/${orderId}/cancel`, {
        method: 'POST',
        body: { reason },
      });
    }

    const currentOrders = getStorage(ORDERS_STORAGE_KEY, []);
    const updated = currentOrders.map((o) =>
      o.orderId === orderId
        ? { ...o, status: 'Đã hủy', cancelReason: reason, cancelledAt: new Date().toISOString() }
        : o
    );
    setStorage(ORDERS_STORAGE_KEY, updated);
    return Promise.resolve({ success: true, orderId, reason });
  }
};

        if (Array.isArray(data) && data.length > 0) return data;

      }
    }
    return Promise.resolve(AVAILABLE_VOUCHERS);
  },

  /**
   * Validate voucher code and compute discount
   */
  async applyVoucher(code, subtotal, shippingFee = 0) {
    const cleanCode = (code || '').toUpperCase().trim();
    if (!cleanCode) {
      return { valid: false, discountAmount: 0, message: 'Vui lòng nhập mã giảm giá' };
    }
    if (API_CONFIG.USE_BACKEND_API) {
      try {
        const res = await apiClient('/vouchers/validate', {
          method: 'POST',
          body: { code: cleanCode, subtotal, shippingFee },
        });
        if (res) {
          return {
            valid: Boolean(res.valid),
            discountAmount: Number(res.discount) || 0,
            voucher: res.voucher || { code: cleanCode, desc: res.message },
            message: res.message,
          };
        }
      } catch (err) {
        console.warn('[voucherService] Backend validate failed, fallback to local:', err);
      }
    }
    return Promise.resolve(applyCoupon(cleanCode, subtotal, shippingFee));
  }
};

      return await apiClient(`/products/${productId}/reviews`);

    const store = getStorage(REVIEWS_STORAGE_KEY, {});
    return Promise.resolve(store[productId] || []);
  },

  /**
   * Submit a new customer review
   */
  async addReview(productId, reviewData) {
    if (API_CONFIG.USE_BACKEND_API) {
      return await apiClient(`/products/${productId}/reviews`, {
        method: 'POST',
        body: reviewData,
      });
    }

    const store = getStorage(REVIEWS_STORAGE_KEY, {});
    const existing = store[productId] || [];
    const newReview = {
      ...reviewData,
      id: Date.now(),
      date: new Date().toLocaleDateString('vi-VN'),
    };
    store[productId] = [newReview, ...existing];
    setStorage(REVIEWS_STORAGE_KEY, store);
    return Promise.resolve(newReview);
  }
};

function Icon({ name, className = "w-4 h-4", size, strokeWidth = 2, fill = "none", ...props }) {

      strokeLinejoin="round"
      className={className}
      {...(size ? { width: size, height: size } : {})}
      {...props}
    >

    </svg>
  );
}


function Toast({ toast }) {
  if (!toast) return null;

  const bgStyles = {
    success: 'bg-emerald-600 text-white',
    error: 'bg-rose-600 text-white',
    info: 'bg-[#161E3E] text-white',
  };

  const iconNames = {
    success: 'check-circle-2',
    error: 'alert-circle',
    info: 'info',
  };

  return (
    <div className="fixed bottom-6 right-6 z-50 animate-in slide-in-from-bottom duration-300">
      <div className={`flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-xl text-xs font-medium ${bgStyles[toast.type] || bgStyles.info}`}>
        <Icon name={iconNames[toast.type] || 'info'} className="w-4 h-4 shrink-0" />
        <span>{toast.message}</span>
      </div>
    </div>
  );
}

function VoucherModal({ isOpen, onClose, cartSubtotal, onSelectVoucher, currentCode, vouchers: propVouchers }) {
  const [vouchersList, setVouchersList] = useState(propVouchers || []);

  useEffect(() => {
    if (propVouchers && propVouchers.length > 0) {
      setVouchersList(propVouchers);
    } else if (isOpen) {
      voucherService.getVouchers()
        .then((data) => {
          if (Array.isArray(data) && data.length > 0) setVouchersList(data);
        })
        .catch((err) => console.warn("[VoucherModal] Error loading vouchers:", err));
    }
  }, [propVouchers, isOpen]);

  if (!isOpen) return null;

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs">
      <div className="bg-white rounded-2xl max-w-md w-full p-6 relative overflow-hidden shadow-2xl animate-in zoom-in-95 duration-200">
        <div className="flex justify-between items-center pb-4 border-b border-[#E5E8EC]">
          <div className="flex items-center gap-2.5">
            <div className="w-8 h-8 rounded-full bg-[#EAF4FA] text-[#0275A9] flex items-center justify-center">
              <Icon name="gift" className="w-4 h-4" />
            </div>
            <div>
              <h3 className="font-bold text-[#141923] text-base">Kho ưu đãi nét.</h3>
              <p className="text-[11px] text-[#707783]">Chọn mã giảm giá đồng bộ từ SQLite Database</p>
            </div>
          </div>
          <button
            onClick={onClose}
            className="w-7 h-7 rounded-full bg-[#F5F6F8] hover:bg-[#E5E8EC] flex items-center justify-center text-[#707783] hover:text-[#141923] transition cursor-pointer"
            aria-label="Đóng"
          >
            <Icon name="x" className="w-4 h-4" />
          </button>
        </div>

        <div className="py-4 space-y-3 max-h-96 overflow-y-auto">
          {vouchersList.length === 0 ? (
            <div className="p-8 text-center text-xs text-[#707783] bg-[#F8FAFC] rounded-xl border border-dashed border-[#CBD5E1]">
              Hiện chưa có mã giảm giá nào trong hệ thống.
            </div>
          ) : (
            vouchersList.map((v) => {
              const isEligible = cartSubtotal >= (v.minOrder || 0);
              const isSelected = currentCode && currentCode.toUpperCase() === v.code.toUpperCase();
              return (
                <div
                  key={v.code}
                  className={`p-3.5 rounded-xl border transition flex flex-col gap-2 ${
                    isSelected
                      ? "bg-[#EAF4FA] border-[#0275A9]"
                      : isEligible
                      ? "bg-white border-[#E5E8EC] hover:border-[#0275A9]/50"
                      : "bg-[#F8FAFC] border-[#E5E8EC] opacity-75"
                  }`}
                >
                  <div className="flex justify-between items-start gap-3">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="font-black text-[#0275A9] text-xs px-2 py-0.5 bg-white border border-[#0275A9]/30 rounded">
                          {v.code}
                        </span>
                        {isSelected && (
                          <span className="text-[10px] bg-emerald-100 text-emerald-700 font-bold px-1.5 py-0.2 rounded-full flex items-center gap-1">
                            <Icon name="check" className="w-3 h-3" /> Đang dùng
                          </span>
                        )}
                      </div>
                      <div className="font-semibold text-xs text-[#141923] mt-1">{v.desc || v.description}</div>
                      <div className="text-[11px] text-[#707783] mt-0.5">
                        Đơn tối thiểu: {formatVND(v.minOrder || 0)}
                      </div>
                    </div>
                    <button
                      disabled={!isEligible}
                      onClick={() => {
                        onSelectVoucher(v.code);
                        onClose();
                      }}
                      className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition shrink-0 ${
                        !isEligible
                          ? "bg-gray-200 text-gray-500 cursor-not-allowed"
                          : isSelected
                          ? "bg-[#0275A9] text-white"
                          : "bg-[#141923] hover:bg-[#0275A9] text-white cursor-pointer"
                      }`}
                    >
                      {isSelected ? "Đang áp dụng" : isEligible ? "Dùng mã" : "Chưa đủ ĐK"}
                    </button>
                  </div>
                  {!isEligible && (
                    <div className="text-[10px] text-amber-600 bg-amber-50 px-2 py-1 rounded">
                      Mua thêm {formatVND((v.minOrder || 0) - cartSubtotal)} để mở khóa mã này
                    </div>
                  )}
                </div>
              );
            })
          )}
        </div>
      </div>
    </div>
  );
}



function OrderDetailModal({ order, isOpen, onClose, onCancelOrder, onReorder }) {
  if (!isOpen || !order) return null;

  const isCancelled = order.status === "Đã hủy";
  const canCancel = order.status === "Chờ xác nhận";

  const steps = [
    { label: "Đặt hàng", desc: "Đã tiếp nhận đơn", done: true },
    { label: "Xác nhận", desc: isCancelled ? "Đơn đã bị hủy" : "nét. đã duyệt", done: !isCancelled },
    { label: "Vận chuyển", desc: "Đang giao nhanh 2h", done: order.status === "Đang vận chuyển" || order.status === "Giao thành công" },
    { label: "Thành công", desc: "Đã nhận hàng", done: order.status === "Giao thành công" }
  ];

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs">
      <div className="bg-white rounded-2xl max-w-xl w-full p-6 relative overflow-hidden shadow-2xl animate-in zoom-in-95 duration-200 max-h-[90vh] flex flex-col">
        {/* Header */}
        <div className="flex justify-between items-start pb-4 border-b border-[#E5E8EC]">
          <div>
            <div className="flex items-center gap-2">
              <span className="font-black text-[#0275A9] text-base">#{order.orderId}</span>
              <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full ${
                isCancelled
                  ? "bg-rose-100 text-rose-700"
                  : order.status === "Giao thành công"
                  ? "bg-emerald-100 text-emerald-700"
                  : "bg-amber-100 text-amber-800"
              }`}>
                {order.status}
              </span>
            </div>
            <p className="text-xs text-[#707783] mt-0.5">Đặt ngày: {order.date} lúc {order.time}</p>
          </div>
          <button
            onClick={onClose}
            className="w-7 h-7 rounded-full bg-[#F5F6F8] hover:bg-[#E5E8EC] flex items-center justify-center text-[#707783] hover:text-[#141923] transition"
          >
            <Icon name="x" className="w-4 h-4" />
          </button>
        </div>

        {/* Scrollable Content */}
        <div className="flex-1 overflow-y-auto py-4 space-y-4">
          {/* Tracking Stepper */}
          <div className="p-4 bg-[#F8FAFC] rounded-xl border border-[#E5E8EC]">
            <h4 className="text-xs font-bold text-[#141923] mb-3">Tiến trình đơn hàng</h4>
            {isCancelled ? (
              <div className="p-3 bg-rose-50 border border-rose-200 rounded-lg text-xs text-rose-700 flex items-center gap-2">
                <Icon name="x" className="w-4 h-4 text-rose-600 shrink-0" />
                <span>Đơn hàng đã hủy ({order.cancelReason || "Khách hàng yêu cầu hủy"}).</span>
              </div>
            ) : (
              <div className="grid grid-cols-4 gap-2 text-center">
                {steps.map((st, i) => (
                  <div key={i} className="flex flex-col items-center">
                    <div className={`w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold mb-1 ${
                      st.done ? "bg-[#0275A9] text-white" : "bg-gray-200 text-gray-500"
                    }`}>
                      {st.done ? <Icon name="check" className="w-3.5 h-3.5" /> : (i + 1)}
                    </div>
                    <span className="text-[11px] font-semibold text-[#141923]">{st.label}</span>
                    <span className="text-[9px] text-[#707783]">{st.desc}</span>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Delivery Info */}
          <div className="p-4 bg-white border border-[#E5E8EC] rounded-xl space-y-2 text-xs">
            <h4 className="font-bold text-[#141923] flex items-center gap-1.5">
              <Icon name="map-pin" className="w-3.5 h-3.5 text-[#0275A9]" />
              <span>Thông tin nhận hàng</span>
            </h4>
            <div className="text-[#141923] font-semibold">
              {order.customer?.fullName || order.customerName || order.tenKhachHang || 'Khách hàng'} · {order.customer?.phone || order.phone || order.soDienThoai || ''}
            </div>
            <div className="text-[#707783]">
              {order.address || [order.customer?.address, order.customer?.district, order.customer?.city].filter(Boolean).join(', ') || 'Chưa cập nhật'}
            </div>
            {(order.note || order.customer?.note) && (
              <div className="text-[11px] text-amber-700 bg-amber-50 p-2 rounded">
                Ghi chú: {order.note || order.customer?.note}
              </div>
            )}
          </div>

          {/* Items */}
          <div className="space-y-2">
            <h4 className="text-xs font-bold text-[#141923]">Sản phẩm ({order.items.length})</h4>
            {order.items.map((it) => (
              <div key={it.cartItemId} className="p-3 bg-[#F8FAFC] border border-[#E5E8EC] rounded-xl flex items-center justify-between text-xs">
                <div className="flex items-center gap-3">
                  <img src={it.img} alt="" className="w-12 h-12 object-contain bg-white rounded-lg p-1 border border-[#E5E8EC]" />
                  <div>
                    <div className="font-bold text-[#141923]">{it.name}</div>
                    <div className="text-[11px] text-[#707783]">
                      Phân loại: {it.selectedColor} · {it.selectedStorage}
                    </div>
                    <div className="text-[11px] text-[#0275A9] font-semibold">
                      SL: {it.quantity} x {formatVND(it.price)}
                    </div>
                  </div>
                </div>
                <span className="font-bold text-[#141923]">{formatVND(it.price * it.quantity)}</span>
              </div>
            ))}
          </div>

          {/* Payment & QR */}
          {order.paymentMethod === "vietqr" && !isCancelled && (
            <div className="p-4 bg-[#EAF4FA] border border-[#0275A9]/30 rounded-xl space-y-2">
              <div className="flex items-center justify-between">
                <span className="text-xs font-bold text-[#0275A9]">Mã QR thanh toán chuyển khoản:</span>
                <span className="text-[11px] bg-white text-[#0275A9] font-bold px-2 py-0.5 rounded border border-[#0275A9]/20">VietQR Napas247</span>
              </div>
              <div className="flex justify-center p-2 bg-white rounded-lg border border-[#E5E8EC]">
                <img
                  src={generateVietQRUrl(order.total, order.orderId)}
                  alt="VietQR"
                  className="max-h-40 object-contain"
                />
              </div>
            </div>
          )}

          {/* Pricing Summary */}
          <div className="p-4 bg-[#F8FAFC] rounded-xl border border-[#E5E8EC] space-y-1.5 text-xs">
            <div className="flex justify-between text-[#707783]">
              <span>Tạm tính:</span>
              <span>{formatVND(order.subtotal || order.total)}</span>
            </div>
            <div className="flex justify-between text-[#707783]">
              <span>Phí vận chuyển:</span>
              <span>{order.shippingFee ? formatVND(order.shippingFee) : "Miễn phí (0₫)"}</span>
            </div>
            {order.discountAmount > 0 && (
              <div className="flex justify-between text-emerald-600 font-semibold">
                <span>Giảm giá voucher:</span>
                <span>-{formatVND(order.discountAmount)}</span>
              </div>
            )}
            <div className="flex justify-between text-[#141923] font-bold text-sm pt-2 border-t border-[#E5E8EC]">
              <span>Tổng thanh toán:</span>
              <span className="text-[#0275A9]">{formatVND(order.total)}</span>
            </div>
          </div>
        </div>

        {/* Footer Actions */}
        <div className="pt-4 border-t border-[#E5E8EC] flex justify-between items-center gap-3">
          {canCancel ? (
            <button
              onClick={() => {
                if (window.confirm("Bạn có chắc chắn muốn hủy đơn hàng này không?")) {
                  onCancelOrder(order.orderId, "Khách hàng yêu cầu hủy trên web");
                }
              }}
              className="px-4 py-2 border border-rose-300 text-rose-600 hover:bg-rose-50 text-xs font-semibold rounded-xl transition cursor-pointer"
            >
              Hủy đơn hàng
            </button>
          ) : (
            <span className="text-xs text-[#707783]">
              {isCancelled ? "Đơn đã đóng" : "Đang xử lý"}
            </span>
          )}

          <button
            onClick={() => {
              onReorder(order.items);
              onClose();
            }}
            className="px-4 py-2 bg-[#0275A9] hover:bg-[#02628e] text-white text-xs font-semibold rounded-xl transition cursor-pointer"
          >
            Mua lại đơn này
          </button>
        </div>
      </div>
    </div>
  );
}

function ReviewFormModal({ isOpen, onClose, product, onSubmitReview }) {
  if (!isOpen || !product) return null;

  const [rating, setRating] = useState(5);
  const [hoverRating, setHoverRating] = useState(0);
  const [author, setAuthor] = useState("");
  const [phone, setPhone] = useState("");
  const [content, setContent] = useState("");
  const [verifiedBuyer, setVerifiedBuyer] = useState(true);

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!author.trim() || !content.trim()) {
      alert("Vui lòng điền họ tên và nội dung đánh giá!");
      return;
    }

    const newRev = {
      id: "rev_" + Date.now(),
      author: author.trim(),
      phone: phone.trim(),
      rating,
      date: "Vừa xong",
      content: content.trim(),
      verified: verifiedBuyer
    };

    onSubmitReview(product.id, newRev);
    onClose();
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs">
      <div className="bg-white rounded-2xl max-w-lg w-full p-6 relative overflow-hidden shadow-2xl animate-in zoom-in-95 duration-200">
        <div className="flex justify-between items-center pb-4 border-b border-[#E5E8EC]">
          <div>
            <h3 className="font-bold text-[#141923] text-base">Đánh giá sản phẩm</h3>
            <p className="text-xs text-[#707783]">{product.name}</p>
          </div>
          <button
            onClick={onClose}
            className="w-7 h-7 rounded-full bg-[#F5F6F8] hover:bg-[#E5E8EC] flex items-center justify-center text-[#707783] hover:text-[#141923] transition"
          >
            <Icon name="x" className="w-4 h-4" />
          </button>
        </div>

        <form onSubmit={handleSubmit} className="py-4 space-y-4 text-xs">
          {/* Star selector */}
          <div className="text-center py-2.5 bg-[#F8FAFC] rounded-xl border border-[#E5E8EC]">
            <div className="font-semibold text-[#141923] mb-2">Bạn đánh giá sản phẩm này thế nào?</div>
            <div className="flex justify-center gap-2">
              {[1, 2, 3, 4, 5].map((star) => (
                <button
                  type="button"
                  key={star}
                  onMouseEnter={() => setHoverRating(star)}
                  onMouseLeave={() => setHoverRating(0)}
                  onClick={() => setRating(star)}
                  className="p-1 transition transform hover:scale-125 cursor-pointer"
                >
                  <Icon
                    name="star"
                    className={`w-7 h-7 ${
                      (hoverRating || rating) >= star
                        ? "fill-amber-400 text-amber-400"
                        : "text-gray-300"
                    }`}
                  />
                </button>
              ))}
            </div>
            <div className="text-[11px] text-amber-600 font-bold mt-1">
              {rating === 5 ? "Rất hài lòng ⭐⭐⭐⭐⭐" : rating === 4 ? "Hài lòng ⭐⭐⭐⭐" : rating === 3 ? "Bình thường ⭐⭐⭐" : rating === 2 ? "Không hài lòng ⭐⭐" : "Rất tệ ⭐"}
            </div>
          </div>

          <div>
            <label className="block font-semibold text-[#141923] mb-1">Họ và tên của bạn *</label>
            <input
              type="text"
              required
              value={author}
              onChange={(e) => setAuthor(e.target.value)}
              placeholder="Ví dụ: Hoàng Minh"
              className="w-full p-2.5 bg-white border border-[#E5E8EC] rounded-xl outline-none focus:border-[#0275A9]"
            />
          </div>

          <div>
            <label className="block font-semibold text-[#141923] mb-1">Số điện thoại (để xác thực)</label>
            <input
              type="tel"
              value={phone}
              onChange={(e) => setPhone(e.target.value)}
              placeholder="Ví dụ: 0912 345 678"
              className="w-full p-2.5 bg-white border border-[#E5E8EC] rounded-xl outline-none focus:border-[#0275A9]"
            />
          </div>

          <div>
            <label className="block font-semibold text-[#141923] mb-1">Cảm nhận chi tiết *</label>
            <textarea
              required
              rows={3}
              value={content}
              onChange={(e) => setContent(e.target.value)}
              placeholder="Chia sẻ về camera, pin, độ mượt hay cảm giác cầm nắm..."
              className="w-full p-2.5 bg-white border border-[#E5E8EC] rounded-xl outline-none focus:border-[#0275A9]"
            />
          </div>

          <label className="flex items-center gap-2 cursor-pointer select-none">
            <input
              type="checkbox"
              checked={verifiedBuyer}
              onChange={(e) => setVerifiedBuyer(e.target.checked)}
              className="w-4 h-4 text-[#0275A9] rounded"
            />
            <span className="text-[#707783]">Tôi xác nhận đã mua và trải nghiệm thực tế tại nét.</span>
          </label>

          <div className="pt-2 flex justify-end gap-2">
            <button
              type="button"
              onClick={onClose}
              className="px-4 py-2.5 border border-[#E5E8EC] text-[#707783] hover:bg-[#F5F6F8] rounded-xl font-semibold cursor-pointer"
            >
              Hủy
            </button>
            <button
              type="submit"
              className="px-6 py-2.5 bg-[#0275A9] hover:bg-[#02628e] text-white rounded-xl font-bold transition shadow-sm cursor-pointer"
            >
              Gửi nhận xét
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}


function AuthModal({ isOpen, currentUser, onLogin, onLogout, onClose, onNavigateOrders, onShowToast, onUpdateProfile, initialTab = "login" }) {
  if (!isOpen) return null;

  const [authTab, setAuthTab] = useState(initialTab || "login");

  useEffect(() => {
    if (initialTab) setAuthTab(initialTab);
  }, [initialTab, isOpen]);
  const [isEditingProfile, setIsEditingProfile] = useState(false);
  const [errorMessage, setErrorMessage] = useState("");
  const [isSubmitting, setIsSubmitting] = useState(false);

  // Form Fields
  const [fullName, setFullName] = useState("");
  const [phone, setPhone] = useState("");
  const [password, setPassword] = useState("");
  const [city, setCity] = useState("Hà Nội");
  const [district, setDistrict] = useState("");
  const [address, setAddress] = useState("");
  const [email, setEmail] = useState("");

  // Edit fields
  const [editName, setEditName] = useState("");
  const [editCity, setEditCity] = useState("Hà Nội");
  const [editDistrict, setEditDistrict] = useState("");
  const [editAddress, setEditAddress] = useState("");
  const [editPassword, setEditPassword] = useState("");

  useEffect(() => {
    setErrorMessage("");
    if (currentUser) {
      setEditName(currentUser.fullName || currentUser.name || "");
      setEditCity(currentUser.city || currentUser.tinhThanh || "Hà Nội");
      setEditDistrict(currentUser.district || currentUser.quanHuyen || "");
      setEditAddress(currentUser.address || currentUser.diaChi || "");
    } else {
      setPhone("");
      setPassword("");
      setFullName("");
      setAddress("");
      setDistrict("");
    }
  }, [currentUser, isOpen]);

  const handleAuthSubmit = async (e) => {
    e.preventDefault();
    setErrorMessage("");
    setIsSubmitting(true);

    try {
      if (authTab === "login") {
        if (!phone.trim() || !password.trim()) {
          setErrorMessage("Vui lòng nhập số điện thoại và mật khẩu!");
          setIsSubmitting(false);
          return;
        }
        const res = await authService.login({ phone: phone.trim(), password: password.trim() });
        if (res.success && res.user) {
          onLogin(res.user);
          onShowToast && onShowToast(res.message || "Đăng nhập thành công!", "success");
          onClose();
        } else {
          setErrorMessage(res.message || "Đăng nhập thất bại");
        }
      } else {
        // Register
        if (!fullName.trim() || !phone.trim() || !password.trim()) {
          setErrorMessage("Vui lòng điền họ tên, số điện thoại và mật khẩu!");
          setIsSubmitting(false);
          return;
        }
        const payload = {
          fullName: fullName.trim(),
          phone: phone.trim(),
          password: password.trim(),
          city,
          district: district.trim(),
          address: address.trim(),
          email: email.trim() || `${phone.trim()}@net.vn`
        };
        const res = await authService.register(payload);
        if (res.success && res.user) {
          onLogin(res.user);
          onShowToast && onShowToast("Tạo tài khoản và lưu địa chỉ thành công!", "success");
          onClose();
        } else {
          setErrorMessage(res.message || "Đăng ký thất bại");
        }
      }
    } catch (err) {
      setErrorMessage(err.message || "Lỗi kết nối máy chủ");
    } finally {
      setIsSubmitting(false);
    }
  };

  const handleSaveProfile = async (e) => {
    e.preventDefault();
    if (!editName.trim()) {
      setErrorMessage("Họ và tên không được để trống");
      return;
    }
    setIsSubmitting(true);
    try {
      const payload = {
        phone: currentUser.phone,
        fullName: editName.trim(),
        city: editCity,
        district: editDistrict.trim(),
        address: editAddress.trim(),
        password: editPassword.trim() || undefined
      };
      const res = await authService.updateProfile(payload);
      if (res.success && res.user) {
        onUpdateProfile && onUpdateProfile(res.user);
        setIsEditingProfile(false);
        setErrorMessage("");
        onShowToast && onShowToast("Đã cập nhật thông tin và địa chỉ mặc định!", "success");
      } else {
        setErrorMessage(res.message || "Không thể cập nhật thông tin");
      }
    } catch (err) {
      setErrorMessage(err.message || "Lỗi cập nhật máy chủ");
    } finally {
      setIsSubmitting(false);
    }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs">
      <div className="bg-white rounded-2xl max-w-md w-full p-6 relative overflow-hidden shadow-2xl animate-in zoom-in-95 duration-200 max-h-[92vh] flex flex-col">
        <button
          onClick={onClose}
          className="absolute top-4 right-4 w-7 h-7 rounded-full bg-[#F5F6F8] hover:bg-[#E5E8EC] flex items-center justify-center text-[#707783] hover:text-[#141923] transition cursor-pointer"
          aria-label="Đóng"
        >
          <Icon name="x" className="w-4 h-4" />
        </button>

        {errorMessage && (
          <div className="mb-3 p-2.5 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl text-xs flex items-center gap-2">
            <Icon name="alert-circle" className="w-4 h-4 shrink-0 text-rose-600" />
            <span>{errorMessage}</span>
          </div>
        )}

        {currentUser ? (
          <div className="space-y-4 py-2 overflow-y-auto">
            <div className="text-center space-y-2">
              <div className="w-16 h-16 rounded-full bg-[#EAF4FA] text-[#0275A9] text-2xl font-black flex items-center justify-center mx-auto shadow-2xs">
                {(currentUser.fullName || currentUser.name || "N").charAt(0).toUpperCase()}
              </div>
              <div>
                <h3 className="font-extrabold text-base text-[#141923]">
                  {currentUser.fullName || currentUser.name}
                </h3>
                <div className="text-xs text-[#707783]">{currentUser.phone}</div>
                <span className="inline-block mt-1 px-2.5 py-0.5 bg-amber-100 text-amber-800 text-[10px] font-bold rounded-full">
                  {currentUser.tier || "Hội viên Nét."}
                </span>
              </div>
            </div>

            {!isEditingProfile ? (
              <div className="space-y-3 text-xs">
                {/* Default Address Card */}
                <div className="p-3.5 bg-[#F8FAFC] border border-[#E5E8EC] rounded-xl space-y-1.5">
                  <div className="flex items-center justify-between">
                    <span className="font-bold text-[#141923] flex items-center gap-1.5">
                      <Icon name="map-pin" className="w-3.5 h-3.5 text-[#0275A9]" />
                      <span>Địa chỉ giao hàng mặc định:</span>
                    </span>
                    <button
                      type="button"
                      onClick={() => setIsEditingProfile(true)}
                      className="text-[11px] text-[#0275A9] hover:underline font-bold cursor-pointer"
                    >
                      Thay đổi
                    </button>
                  </div>
                  <div className="text-[#141923] font-medium leading-relaxed pl-5">
                    {currentUser.address || currentUser.diaChi
                      ? `${currentUser.address || currentUser.diaChi}, ${currentUser.district || currentUser.quanHuyen ? currentUser.district || currentUser.quanHuyen + ", " : ""}${currentUser.city || currentUser.tinhThanh || ""}`
                      : <span className="text-[#707783] italic">Chưa thiết lập địa chỉ. Bấm "Thay đổi" để thêm địa chỉ tự động điền khi mua hàng.</span>}
                  </div>
                </div>

                <div className="pt-2 space-y-2">
                  <button
                    onClick={() => {
                      onClose();
                      onNavigateOrders && onNavigateOrders();
                    }}
                    className="w-full py-2.5 bg-[#F5F6F8] hover:bg-[#E5E8EC] text-xs font-semibold rounded-xl text-[#141923] transition flex items-center justify-center gap-2 cursor-pointer"
                  >
                    <Icon name="package" className="w-4 h-4 text-[#0275A9]" />
                    <span>Xem lịch sử đơn hàng của tôi</span>
                  </button>
                  <button
                    onClick={() => {
                      onLogout();
                      onClose();
                    }}
                    className="w-full py-2.5 bg-rose-50 hover:bg-rose-100 text-xs font-semibold rounded-xl text-rose-600 transition cursor-pointer"
                  >
                    Đăng xuất
                  </button>
                </div>
              </div>
            ) : (
              /* Edit Profile & Address Form */
              <form onSubmit={handleSaveProfile} className="space-y-3 text-xs">
                <div className="font-bold text-[#141923] pb-1 border-b border-[#E5E8EC] flex items-center justify-between">
                  <span>Cập nhật thông tin & Địa chỉ mặc định</span>
                  <button
                    type="button"
                    onClick={() => setIsEditingProfile(false)}
                    className="text-[11px] text-[#707783] hover:text-[#141923]"
                  >
                    Đóng
                  </button>
                </div>

function InstallmentModal({ isOpen, onClose, product, finalPrice, selectedColor, selectedStorage, onConfirmInstallment }) {

  const [termMonths, setTermMonths] = useState(6); // 3, 6, 9, 12 tháng

  const loanAmount = finalPrice - prepaidAmount;
  const monthlyPayment = Math.round(loanAmount / termMonths);

  const handleApply = () => {
    onConfirmInstallment({
      term: termMonths,
      prepaidPercent,
      prepaidAmount,
      monthlyPayment,
    });
    onClose();
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs">

            <Icon name="x" className="w-4 h-4" />

            <div className="grid grid-cols-4 gap-2">
              {[0, 20, 30, 50].map((pct) => (
                <button

function ProductDetailPage({ products = [], productId, onAddToCart, onToggleWishlist, wishlist, onNavigate, onShowToast, customReviews = [], onAddReview, storeSettings }) {
  const product = useMemo(() => {
    return products.find((p) => p.id === productId || p.slug === productId) || products[0] || {};
  }, [products, productId]);

  const [activeImg, setActiveImg] = useState(product.gallery?.[0] || product.img);
  // Đa nhóm phân loại (Hỗ trợ N nhóm đồng nhất: Ảnh + Chữ)
  const displayGroups = useMemo(() => {
    if (product.variantGroups && product.variantGroups.length > 0) {
      return product.variantGroups;
    }
    const list = [];
    if (product.colors && product.colors.length > 0) {
      list.push({
        name: product.variantGroupName || product.variantGroup1Name || "Màu sắc",
        options: product.colors.map((item, i) => ({
          id: item.id || `g1_${i}`,
          name: item.name,
          img: item.img || product.gallery?.[i] || product.img,
        })),
      });
    }
    if (product.storageOptions && product.storageOptions.length > 1) {
      list.push({
        name: product.variantGroup2Name || "Phiên bản",
        options: product.storageOptions.map((s, i) => ({
          id: s.id || `g2_${i}`,
          name: s.label || s.name,
          img: "",
        })),
      });
    }
    return list;
  }, [product.variantGroups, product.colors, product.storageOptions, product.gallery, product.img]);

  const [selectedGroupOptions, setSelectedGroupOptions] = useState(() => {
    const init = {};
    displayGroups.forEach((g, idx) => {
      init[idx] = g.options?.[0]?.name || "";
    });
    return init;
  });

  const selectedColor = selectedGroupOptions[0] || "";
  const selectedStorage = { label: selectedGroupOptions[1] || "" };

  const [quantity, setQuantity] = useState(1);
  const [isReviewModalOpen, setIsReviewModalOpen] = useState(false);
  const [isInstallmentModalOpen, setIsInstallmentModalOpen] = useState(false);

  // Real Comments & Q&A from SQLite
  const [comments, setComments] = useState([]);
  const [commentAuthor, setCommentAuthor] = useState("");
  const [commentPhone, setCommentPhone] = useState("");
  const [commentContent, setCommentContent] = useState("");
  const [isSubmittingComment, setIsSubmittingComment] = useState(false);
  const [settingsData, setSettingsData] = useState(storeSettings || null);

  useEffect(() => {
    const init = {};
    displayGroups.forEach((g, idx) => {
      init[idx] = g.options?.[0]?.name || "";
    });
    setSelectedGroupOptions(init);

    const firstWithImg = displayGroups[0]?.options?.[0]?.img;
    if (firstWithImg) {
      setActiveImg(firstWithImg);
    } else {
      setActiveImg(product.gallery?.[0] || product.img);
    }
    setQuantity(1);

    if (product?.id) {
      fetch(`http://localhost:5000/api/comments?productId=${product.id}&status=approved`)
        .then((res) => res.json())
        .then((data) => { if (Array.isArray(data)) setComments(data); })
        .catch((err) => console.warn("[PDP] Comments fetch error:", err));
    }
    if (!settingsData) {
      fetch('http://localhost:5000/api/settings')
        .then((res) => res.json())
        .then((data) => { if (data) setSettingsData(data); })
        .catch((err) => console.warn("[PDP] Settings fetch error:", err));
    }
  }, [product?.id]);

  const handleSubmitComment = async (e) => {
    e.preventDefault();
    if (!commentContent.trim()) {
      if (onShowToast) onShowToast("Vui lòng nhập nội dung câu hỏi!", "info");
      return;
    }
    setIsSubmittingComment(true);
    try {
      const res = await fetch("http://localhost:5000/api/comments", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          productId: product.id,
          author: commentAuthor.trim() || "Khách hàng",
          phone: commentPhone.trim(),
          content: commentContent.trim(),
        }),
      });
      const data = await res.json();
      if (res.ok) {
        setComments((prev) => [data, ...prev]);
        setCommentContent("");
        setCommentPhone("");
        if (onShowToast) onShowToast("Gửi câu hỏi thành công! nét. sẽ sớm phản hồi.", "success");
      } else {
        if (onShowToast) onShowToast(data.error || "Gửi thất bại", "error");
      }
    } catch (err) {
      if (onShowToast) onShowToast("Không thể kết nối đến máy chủ", "error");
    } finally {
      setIsSubmittingComment(false);
    }
  };

  // Pricing calculations
  // Tìm tổ hợp biến thể hiện tại (khớp tất cả các nhóm)
  const currentVariant = useMemo(() => {
    if (!product.variants || product.variants.length === 0) return null;
    const selectedNames = displayGroups.map((g, idx) => selectedGroupOptions[idx] || g.options?.[0]?.name || "");

    const exactKey = selectedNames.join(" · ");
    const match = product.variants.find((v) => {
      if (v.name === exactKey) return true;
      if (v.options && Array.isArray(v.options)) {
        return v.options.every((optName, idx) => optName === selectedNames[idx]);
      }
      return selectedNames.every((n) => v.name?.includes(n));
    });
    return match || product.variants[0];
  }, [product.variants, displayGroups, selectedGroupOptions]);

  const basePrice = Number(product.price) || 0;
  const variantDirectPrice = currentVariant && currentVariant.price !== undefined && currentVariant.price !== null && currentVariant.price !== ""
    ? Number(currentVariant.price)
    : null;
  const priceDiff = Number(currentVariant?.priceDiff) || 0;
  const finalPrice = variantDirectPrice !== null ? variantDirectPrice : (currentVariant ? (basePrice + priceDiff) : basePrice);

  const currentStock = currentVariant && currentVariant.stock !== undefined && currentVariant.stock !== null && currentVariant.stock !== ""
    ? Math.max(0, Number(currentVariant.stock))
    : Math.max(0, Number(product.stock ?? product.ton_kho ?? 50));
  const isOutOfStock = currentStock <= 0;

  // Trạng thái giảm giá của biến thể đang chọn
  const isVariantDiscounted = Boolean(
    currentVariant && currentVariant.hasDiscount !== undefined
      ? (currentVariant.hasDiscount && currentVariant.originalPrice && Number(currentVariant.originalPrice) > finalPrice)
      : (product?.hasDiscount || (product?.originalPrice && Number(product.originalPrice) > finalPrice))
  );

  const finalOriginalPrice = isVariantDiscounted
    ? (currentVariant?.originalPrice ? Number(currentVariant.originalPrice) : (product?.originalPrice ? Number(product.originalPrice) : null))
    : null;

  const handleSelectGroupOption = (grpIdx, opt) => {
    setSelectedGroupOptions((prev) => ({
      ...prev,
      [grpIdx]: opt.name,
    }));
    if (opt.img) {
      setActiveImg(opt.img);
    }
  };

  // Review & Rating calculations (100% Real from SQLite Data, no fake numbers)
  const allReviews = useMemo(() => {
    return [...(customReviews || []), ...(product.reviews || [])];
  }, [customReviews, product.reviews]);

  const reviewCount = allReviews.length;
  const avgRating = useMemo(() => {
    if (reviewCount === 0) return "0.0";
    const sum = allReviews.reduce((acc, r) => acc + (Number(r.rating) || 5), 0);
    return (sum / reviewCount).toFixed(1);
  }, [allReviews, reviewCount]);

  // Tiêu đề động đồng bộ biến thể được chọn
  const displayTitle = useMemo(() => {
    const base = product.fullName || product.name || "";
    const spec = selectedGroupOptions[1] || selectedStorage?.label || "";
    if (!spec) return base;
    if (base.includes("Chính Hãng VN/A")) {
      return base.replace("Chính Hãng VN/A", `${spec} Chính Hãng VN/A`);
    }
    return `${base} · ${spec}`;
  }, [product.fullName, product.name, selectedGroupOptions, selectedStorage]);

  const comboName = displayGroups.map((g, idx) => selectedGroupOptions[idx] || g.options?.[0]?.name).filter(Boolean).join(" · ");

  const handleBuyNow = () => {
    if (isOutOfStock) return;
    onAddToCart(product, {
      variant: comboName,
      color: selectedGroupOptions[0] || "",
      storage: selectedGroupOptions[1] || "",
      price: finalPrice,
      priceDiff: currentVariant?.priceDiff || 0,
      img: activeImg,
      quantity,
    });
    onNavigate("#/checkout");
  };

  const handleAddToCartWithVariant = () => {
    if (isOutOfStock) return;
    onAddToCart(product, {
      variant: comboName,
      color: selectedGroupOptions[0] || "",
      storage: selectedGroupOptions[1] || "",
      price: finalPrice,
      priceDiff: currentVariant?.priceDiff || 0,
      img: activeImg,
      quantity,
    });
  };

  const handleConfirmInstallment = (installmentInfo) => {
    if (isOutOfStock) return;
    onAddToCart(product, {
      variant: comboName,
      color: selectedColor,
      storage: selectedStorage?.label,
      price: finalPrice,
      priceDiff: currentVariant?.priceDiff || 0,
      quantity: 1,
      installment: installmentInfo,
    });
    onNavigate("#/checkout");
  };

  return (
    <div className="w-full px-4 sm:px-8 lg:px-16 py-8 animate-in zoom-in-95 duration-200">
      
      {/* Installment Modal */}
      <InstallmentModal
        isOpen={isInstallmentModalOpen}
        onClose={() => setIsInstallmentModalOpen(false)}
        product={product}
        finalPrice={finalPrice}
        selectedColor={selectedColor}
        selectedStorage={selectedStorage}
        onConfirmInstallment={handleConfirmInstallment}
      />

      {/* Review Submission Modal */}
      <ReviewFormModal
        isOpen={isReviewModalOpen}
        onClose={() => setIsReviewModalOpen(false)}
        product={product}
        onSubmitReview={(prodId, rev) => {
          if (onAddReview) onAddReview(prodId, rev);
        }}
      />

      {/* Breadcrumb Navigation */}
      <nav className="text-xs text-[#707783] flex items-center gap-2 mb-6">
        <button onClick={() => onNavigate("#/")} className="hover:text-[#0275A9] cursor-pointer">Trang chủ</button>
        <span>/</span>
        <button onClick={() => onNavigate(`#/category/${product.category}`)} className="hover:text-[#0275A9] cursor-pointer">
          {product.categoryLabel || product.category}
        </button>
        <span>/</span>
        <span className="text-[#141923] font-semibold truncate">{product.name}</span>
      </nav>

      {/* Top Main Section: Gallery & Purchase Information */}
      <div className="grid grid-cols-1 lg:grid-cols-12 gap-10 items-start">
        
        {/* Left: Product Images Gallery (5 Cols) */}
        <div className="lg:col-span-5 space-y-4">
          <div className="w-full h-[400px] bg-[#F5F6F8] rounded-2xl p-6 flex items-center justify-center relative overflow-hidden border border-[#E5E8EC]">
            <img
              src={activeImg}

        {/* Comment Question Form */}
        <form onSubmit={handleSubmitComment} className="p-4 bg-[#F8FAFC] border border-[#E5E8EC] rounded-xl space-y-3">

          <textarea

          <div className="flex justify-end">
            <button
              type="submit"

            >
              <span>{isSubmittingComment ? "Đang gửi..." : "Gửi câu hỏi / bình luận"}</span>
              <Icon name="send" className="w-3.5 h-3.5" />
            </button>
          </div>
        </form>

        {/* Comments List */}
        {comments.length === 0 ? (
          <div className="p-8 bg-[#F8FAFC] border border-dashed border-[#CBD5E1] rounded-xl text-center text-xs text-[#707783]">
            Chưa có câu hỏi nào cho sản phẩm này. Hãy đặt câu hỏi để được chuyên viên tư vấn hỗ trợ ngay!
          </div>
        ) : (
          <div className="space-y-4">
            {comments.map((cm) => (
              <div key={cm.id} className="p-4 bg-white border border-[#E5E8EC] rounded-xl space-y-2.5 shadow-2xs">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <div className="w-7 h-7 rounded-full bg-[#EAF4FA] text-[#0275A9] font-bold text-xs flex items-center justify-center">
                      {(cm.author || "K")[0].toUpperCase()}
                    </div>
                    <div>
                      <span className="font-bold text-xs text-[#141923]">{cm.author}</span>
                      <span className="text-[10px] text-[#707783] ml-2">• {cm.createdAt || "Vừa xong"}</span>
                    </div>
                  </div>
                </div>
                <p className="text-xs text-[#334155] leading-relaxed pl-9">{cm.content}</p>

                {/* Admin Reply */}
                {cm.reply && (
                  <div className="ml-9 p-3 bg-[#EAF4FA] border border-[#0275A9]/20 rounded-xl space-y-1 text-xs">
                    <div className="flex items-center gap-1.5 font-bold text-[#0275A9] text-[11px]">
                      <Icon name="shield-check" className="w-3.5 h-3.5 text-[#0275A9]" />
                      <span>nét. Quản trị viên phản hồi:</span>
                    </div>
                    <p className="text-[#141923] leading-relaxed text-xs">{cm.reply}</p>
                  </div>
                )}
              </div>
            ))}
          </div>
        )}

      </div>

    </div>
  );
}



function CheckoutPage({ cart, cartSubtotal, onClearCart, onNavigate, currentUser, onAddOrder, onShowToast, selectedVoucherCode, onOpenVoucherModal, onClearSelectedVoucher, onOpenAuthModal }) {
  const [formData, setFormData] = useState({
    fullName: currentUser?.fullName || currentUser?.name || "",
    phone: currentUser?.phone || "",
    email: currentUser?.email || "",
    city: currentUser?.city || currentUser?.tinhThanh || "Hà Nội",
    district: currentUser?.district || currentUser?.quanHuyen || "Quận Cầu Giấy",
    address: currentUser?.address || currentUser?.diaChi || "",
    note: "",
    shippingMethod: "standard",
    paymentMethod: "vietqr",
  });

  // Auto-fill whenever currentUser logs in or updates address (Clean reset without leaking previous user's data)
  useEffect(() => {
    setFormData({
      fullName: currentUser?.fullName || currentUser?.name || "",
      phone: currentUser?.phone || "",
      email: currentUser?.email || "",
      city: currentUser?.city || currentUser?.tinhThanh || "Hà Nội",
      district: currentUser?.district || currentUser?.quanHuyen || "",
      address: currentUser?.address || currentUser?.diaChi || "",
      note: "",
      shippingMethod: "standard",
      paymentMethod: "vietqr",
    });
  }, [currentUser]);

  const [errors, setErrors] = useState({});
  const [couponInput, setCouponInput] = useState(selectedVoucherCode || "");
  const [appliedVoucher, setAppliedVoucher] = useState(null);
  const [discountAmount, setDiscountAmount] = useState(0);
  const [vouchersCount, setVouchersCount] = useState(0);

  useEffect(() => {
    voucherService.getVouchers()
      .then((data) => {
        if (Array.isArray(data)) setVouchersCount(data.length);
      })
      .catch(() => {});
  }, []);

  useEffect(() => {
    if (selectedVoucherCode) {
      setCouponInput(selectedVoucherCode);
      const applyAsync = async () => {
        const curFee = formData.shippingMethod === "instant" ? 30000 : 0;
        const res = await voucherService.applyVoucher(selectedVoucherCode, cartSubtotal, curFee);
        if (res.valid) {
          setAppliedVoucher(res.voucher);
          setDiscountAmount(res.discountAmount);
          onShowToast(res.message, "success");
        } else {
          setAppliedVoucher(null);
          setDiscountAmount(0);
          onShowToast(res.message, "info");
        }
      };
      applyAsync();
    }
  }, [selectedVoucherCode, cartSubtotal, formData.shippingMethod]);

  const validateField = (name, value) => {
    let err = "";
    if (name === "fullName") {
      if (!value || !value.trim()) err = "Vui lòng nhập họ và tên";
    }
    if (name === "phone") {
      const phoneRegex = /^0(3|5|7|8|9)[0-9]{8}$/;
      if (!value || !value.trim()) err = "Vui lòng nhập số điện thoại nhận hàng";
      else if (!phoneRegex.test(value.trim())) err = "Số điện thoại không hợp lệ (10 số, bắt đầu bằng 03, 05, 07, 08, 09)";
    }
    if (name === "email" && value && value.trim()) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(value.trim())) err = "Định dạng email không hợp lệ";
    }
    if (name === "address") {
      if (!value || !value.trim()) err = "Vui lòng nhập số nhà, tên đường chi tiết";
      else if (value.trim().length < 3) err = "Địa chỉ nhận hàng quá ngắn (tối thiểu 3 ký tự)";
    }
    setErrors((prev) => ({ ...prev, [name]: err }));
    return err;
  };

  const shippingFee = formData.shippingMethod === "instant" ? 30000 : 0;
  const finalTotal = Math.max(0, cartSubtotal + shippingFee - discountAmount);

  const handleApplyCoupon = async () => {
    if (!couponInput.trim()) {
      onShowToast("Vui lòng nhập mã giảm giá", "info");
      return;
    }
    const curFee = formData.shippingMethod === "instant" ? 30000 : 0;
    const res = await voucherService.applyVoucher(couponInput.trim(), cartSubtotal, curFee);
    if (res.valid) {
      setAppliedVoucher(res.voucher);
      setDiscountAmount(res.discountAmount);
      onShowToast(res.message, "success");
    } else {
      setAppliedVoucher(null);
      setDiscountAmount(0);
      onShowToast(res.message || "Mã giảm giá không hợp lệ", "info");
    }
  };

  const handleSubmitOrder = async (e) => {
    e.preventDefault();
    if (!currentUser) {
      onShowToast("Vui lòng đăng nhập hoặc tạo tài khoản để đặt hàng", "warning");
      onOpenAuthModal && onOpenAuthModal("login");
      return;
    }

    const e1 = validateField("fullName", formData.fullName);
    const e4 = validateField("address", formData.address);

    const firstError = e1 || e4;
    if (firstError) {
      onShowToast(firstError, "warning");
      return;
    }

    if (cart.length === 0) {
      onShowToast("Giỏ hàng đang trống!", "info");
      return;
    }

    const orderId = generateOrderId();
    const newOrder = {
      orderId,
      date: new Date().toLocaleDateString("vi-VN"),
      time: new Date().toLocaleTimeString("vi-VN"),
      customer: { ...formData, phone: currentUser.phone },
      phone: currentUser.phone,
      userId: currentUser.id,
      items: [...cart],
      subtotal: cartSubtotal,
      shippingFee,
      discountAmount,
      total: finalTotal,
      paymentMethod: formData.paymentMethod,
      status: "Chờ xác nhận",
      voucherCode: appliedVoucher?.code || "",
      maVoucher: appliedVoucher?.code || "",
    };

    const res = await onAddOrder(newOrder);
    if (res && res.error) {
      onShowToast(res.message || "Không thể tạo đơn hàng. Vui lòng thử lại.", "warning");
      return;
    }

    onClearCart();
    onNavigate(`#/order-success/${orderId}`);
  };

  if (cart.length === 0) {
    return (
      <div className="max-w-xl mx-auto py-20 px-4 text-center">

          <Icon name="shopping-bag" className="w-8 h-8" strokeWidth={1.75} />

        </button>

          <Icon name="shield" className="w-10 h-10 text-[#0275A9]" strokeWidth={2} />
        </div>
        <div className="inline-block px-3 py-1 bg-amber-50 border border-amber-200 text-amber-800 text-[11px] font-bold rounded-full mb-3">

        <h2 className="text-2xl font-black text-[#141923] mb-3">

        <p className="text-xs sm:text-sm text-[#707783] mb-6 leading-relaxed max-w-md mx-auto">

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5 text-xs">
              <div>

                <select

                >

                </select>

              <div>
                <label className="block text-[#707783] mb-1 font-medium">Quận / Huyện *</label>
                <input

              <input

                onChange={(e) => {

                  if (errors.address) validateField("address", e.target.value);

                onBlur={(e) => validateField("address", e.target.value)}
                placeholder="Số 123 đường Cầu Giấy, P. Dịch Vọng..."
                className={`w-full p-2.5 bg-[#F8FAFC] border ${errors.address ? 'border-red-500 ring-1 ring-red-500 bg-red-50/20' : 'border-[#E5E8EC]'} rounded-lg outline-none focus:border-[#0275A9] text-[#141923]`}

              <input

                placeholder="Ví dụ: Giao trong giờ hành chính, gọi trước khi đến..."
                className="w-full p-2.5 bg-[#F8FAFC] border border-[#E5E8EC] rounded-lg outline-none focus:border-[#0275A9] text-[#141923]"
              />

              >
                <input

                <div className="flex-1">
                  <div className="font-bold text-[#141923] flex items-center gap-2">

                  formData.paymentMethod === "cod"

              >

                  className="mt-0.5 text-[#0275A9]"
                />
                <div className="flex-1">
                  <div className="font-bold text-[#141923]">Thanh toán tiền mặt khi nhận hàng (COD)</div>
                  <p className="text-[#707783] text-[11px] mt-0.5">
                    Nhận hàng, kiểm tra ngoại quan máy và thanh toán trực tiếp cho nhân viên giao hàng.
                  </p>
                </div>

              {/* Card Option */}
              <label
                className={`p-3.5 border rounded-xl flex items-start gap-3 cursor-pointer transition ${

                }`}
              >
                <input

                  name="payment"
                  checked={formData.paymentMethod === "card"}
                  onChange={() => setFormData({ ...formData, paymentMethod: "card" })}
                  className="mt-0.5 text-[#0275A9]"
                />
                <div className="flex-1">

}

function CategoryPage({ products = [], categorySlug, onAddToCart, onToggleWishlist, wishlist, onQuickView, onNavigate, onShowToast }) {
  const [selectedBrand, setSelectedBrand] = useState("all");
  const [selectedPriceRange, setSelectedPriceRange] = useState("all");
  const [sortBy, setSortBy] = useState("default");

  const categoryName = useMemo(() => {
    if (categorySlug === "all") return "Tất cả thiết bị công nghệ";
    const found = CATEGORIES.find((c) => c.slug === categorySlug);
    return found ? found.name : "Danh mục sản phẩm";
  }, [categorySlug]);

  const filteredProducts = useMemo(() => {
    let list = products;
    if (categorySlug && categorySlug !== "all") {
      list = list.filter((p) => p.category === categorySlug);
    }
    if (selectedBrand !== "all") {
      list = list.filter((p) => p.brand === selectedBrand);
    }
    if (selectedPriceRange === "under-10") {
      list = list.filter((p) => p.price < 10000000);
    } else if (selectedPriceRange === "10-20") {
      list = list.filter((p) => p.price >= 10000000 && p.price <= 20000000);
    } else if (selectedPriceRange === "over-20") {
      list = list.filter((p) => p.price > 20000000);
    }

    if (sortBy === "price-asc") {
      list = [...list].sort((a, b) => a.price - b.price);
    } else if (sortBy === "price-desc") {
      list = [...list].sort((a, b) => b.price - a.price);
    } else if (sortBy === "rating") {
      list = [...list].sort((a, b) => b.rating - a.rating);
    }

    return list;
  }, [products, categorySlug, selectedBrand, selectedPriceRange, sortBy]);

  return (
    <div className="w-full px-4 sm:px-8 lg:px-16 py-8 animate-in zoom-in-95 duration-200 space-y-6">
      {/* Breadcrumb */}
      <nav className="text-xs text-[#707783] flex items-center gap-2">
        <button onClick={() => onNavigate("#/")} className="hover:text-[#0275A9]">Trang chủ</button>
        <span>/</span>
        <span className="text-[#141923] font-semibold">{categoryName}</span>
      </nav>

      <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-[#E5E8EC] pb-4">
        <div>
          <h1 className="text-2xl font-extrabold text-[#141923]">{categoryName}</h1>
          <p className="text-xs text-[#707783] mt-0.5">Tìm thấy {filteredProducts.length} sản phẩm chính hãng</p>
        </div>

        {/* Sorting Dropdown */}
        <div className="flex items-center gap-2 text-xs">
          <span className="text-[#707783]">Sắp xếp:</span>
          <select
            value={sortBy}
            onChange={(e) => setSortBy(e.target.value)}
            className="p-2 bg-[#F8FAFC] border border-[#E5E8EC] rounded-lg text-xs outline-none focus:border-[#0275A9]"
          >
            <option value="default">Mặc định (Nổi bật nhất)</option>
            <option value="price-asc">Giá: Thấp đến Cao</option>
            <option value="price-desc">Giá: Cao đến Thấp</option>
            <option value="rating">Đánh giá cao nhất</option>
          </select>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        {/* Left Sidebar Filters (3 Cols) */}
        <div className="lg:col-span-3 space-y-6 p-5 bg-[#F8FAFC] border border-[#E5E8EC] rounded-2xl">
          {/* Brand Filter */}
          <div className="space-y-2.5">
            <h3 className="text-xs font-bold text-[#141923] uppercase tracking-wider">Thương hiệu</h3>
            <div className="space-y-1.5 text-xs text-[#707783]">
              {[
                { id: "all", label: "Tất cả thương hiệu" },
                { id: "apple", label: "Apple" },
                { id: "samsung", label: "Samsung" },
                { id: "xiaomi", label: "Xiaomi" },
                { id: "oppo", label: "OPPO" },
                { id: "sony", label: "Sony" },
              ].map((b) => (
                <label key={b.id} className="flex items-center gap-2 cursor-pointer hover:text-[#141923]">
                  <input
                    type="radio"
                    name="brand"
                    checked={selectedBrand === b.id}
                    onChange={() => setSelectedBrand(b.id)}
                    className="text-[#0275A9]"
                  />
                  <span>{b.label}</span>
                </label>
              ))}
            </div>
          </div>

          {/* Price Range Filter */}
          <div className="space-y-2.5 pt-4 border-t border-[#E5E8EC]">
            <h3 className="text-xs font-bold text-[#141923] uppercase tracking-wider">Khoảng giá</h3>
            <div className="space-y-1.5 text-xs text-[#707783]">
              {[
                { id: "all", label: "Tất cả mức giá" },
                { id: "under-10", label: "Dưới 10 triệu" },
                { id: "10-20", label: "Từ 10 - 20 triệu" },
                { id: "over-20", label: "Trên 20 triệu" },
              ].map((p) => (
                <label key={p.id} className="flex items-center gap-2 cursor-pointer hover:text-[#141923]">
                  <input
                    type="radio"
                    name="price"
                    checked={selectedPriceRange === p.id}
                    onChange={() => setSelectedPriceRange(p.id)}
                    className="text-[#0275A9]"
                  />
                  <span>{p.label}</span>
                </label>
              ))}
            </div>
          </div>

          <button
            onClick={() => {
              setSelectedBrand("all");
              setSelectedPriceRange("all");
              setSortBy("default");
            }}
            className="w-full py-2 bg-white hover:bg-[#E5E8EC] border border-[#E5E8EC] text-xs font-semibold rounded-lg text-[#707783] hover:text-[#141923] transition"
          >
            Đặt lại bộ lọc
          </button>
        </div>

        {/* Right Product Grid (9 Cols) */}
        <div className="lg:col-span-9">
          {filteredProducts.length === 0 ? (
            <div className="p-12 text-center text-[#707783] bg-[#F8FAFC] rounded-2xl border border-[#E5E8EC]">
              <div className="w-14 h-14 rounded-full bg-[#EAF4FA] text-[#0275A9] flex items-center justify-center mx-auto mb-3 shadow-2xs">
                <Icon name="search" className="w-7 h-7" strokeWidth={1.75} />
              </div>
              <h3 className="text-sm font-bold text-[#141923] mb-1">Không tìm thấy sản phẩm phù hợp</h3>
              <p className="text-xs">Hãy thử đổi thương hiệu hoặc nới lỏng khoảng giá.</p>
            </div>
          ) : (
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
              {filteredProducts.map((p) => (
                <ProductCard
                  key={p.id}
                  product={p}
                  isWishlisted={wishlist.includes(p.id)}
                  onAddToCart={() => onAddToCart(p)}
                  onToggleWishlist={() => onToggleWishlist(p.id, p.name)}
                  onQuickView={() => onQuickView(p)}
                  onSelect={() => onNavigate(`#/product/${p.id}`)}
                />
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}
