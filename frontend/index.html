function App() {
  // 1. ROUTER STATE
  const [currentRoute, setCurrentRoute] = useState(() =>
    parseRoute(window.location.hash)
  );

  useEffect(() => {
    const handleHashChange = () => {
      setCurrentRoute(parseRoute(window.location.hash));
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
    window.addEventListener("hashchange", handleHashChange);
    return () => window.removeEventListener("hashchange", handleHashChange);
  }, []);

  const navigate = (hash) => {
    window.location.hash = hash;
  };

  // 2. BACKEND & PERSISTENT GLOBAL STATE
  const [products, setProducts] = useState(() => INITIAL_PRODUCTS);
  const [banners, setBanners] = useState([]);
  const [articles, setArticles] = useState(() => ARTICLES);
  const [faqs, setFaqs] = useState(() => FAQS);
  const [storeSettings, setStoreSettings] = useState({});
  const [isLoadingProducts, setIsLoadingProducts] = useState(false);
  const [cart, setCart] = useState(() => {
    const raw = getStorage("net_cart", []);
    return Array.isArray(raw)
      ? raw.map((item) => ({ ...item, price: Math.max(0, Number(item.price) || 0) }))
      : [];
  });
  const [wishlist, setWishlist] = useState(() => getStorage("net_wishlist", []));
  const [orders, setOrders] = useState([]);
  const [vouchers, setVouchers] = useState([]);
  const [currentUser, setCurrentUser] = useState(() => getStorage("net_user", null));
  const [authModalTab, setAuthModalTab] = useState("login");
  const [pendingCheckout, setPendingCheckout] = useState(false);
  const [isVoucherModalOpen, setIsVoucherModalOpen] = useState(false);
  const [selectedVoucherCode, setSelectedVoucherCode] = useState("");
  const [productReviews, setProductReviews] = useState(() => getStorage("net_custom_reviews", {}));

  // Nap du lieu thuc te tu SQLite Backend (Tu dong dong bo khi chuyen tab hoac focus)
  useEffect(() => {
    const loadProducts = () => {
      productService.getAll()
        .then((data) => {
          if (data && data.length > 0) setProducts(data);
        })
        .catch((err) => {
          console.warn("[App] Backend offline:", err);
        });
    };
    loadProducts();
    window.addEventListener("focus", loadProducts);
    fetch('http://localhost:5000/api/banners')
      .then((res) => res.json())
      .then((data) => { if (Array.isArray(data)) setBanners(data); })
      .catch((err) => console.error('[App] Lỗi tải banners:', err));

    fetch('http://localhost:5000/api/articles')
      .then((res) => res.json())
      .then((data) => { if (Array.isArray(data)) setArticles(data); })
      .catch((err) => console.error('[App] Lỗi tải articles:', err));

    fetch('http://localhost:5000/api/faqs')
      .then((res) => res.json())
      .then((data) => { if (Array.isArray(data)) setFaqs(data); })
      .catch((err) => console.error('[App] Lỗi tải faqs:', err));

    fetch('http://localhost:5000/api/settings')
      .then((res) => res.json())
      .then((data) => { if (data) setStoreSettings(data); })
      .catch((err) => console.error('[App] Lỗi tải settings:', err));

    fetch('http://localhost:5000/api/vouchers')
      .then((res) => res.json())
      .then((data) => { if (Array.isArray(data)) setVouchers(data); })
      .catch((err) => console.warn('[App] Lỗi tải vouchers:', err));
  }, []);

  // Đồng bộ đơn hàng cá nhân của người dùng (Cô lập dữ liệu tuyệt đối giữa các tài khoản)
  useEffect(() => {
    const userPhone = currentUser?.phone;
    if (!userPhone) {
      setOrders([]);
      return;
    }

    const loadUserOrders = () => {
      orderService.getOrders(userPhone)
        .then((data) => {
          if (Array.isArray(data)) setOrders(data);
        })
        .catch((err) => console.warn('[App] Lỗi đồng bộ đơn hàng user:', err));
    };

    loadUserOrders();
    const timer = setInterval(loadUserOrders, 3000);
    window.addEventListener('focus', loadUserOrders);
    return () => {
      clearInterval(timer);
      window.removeEventListener('focus', loadUserOrders);
    };
  }, [currentUser?.phone]);

  // Tự động đồng bộ sản phẩm mới nhất từ SQLite (Realtime Polling 3s & Window Focus)
  useEffect(() => {
    const refreshProducts = () => {
      productService.getAll()
        .then((data) => {
          if (data && data.length > 0) setProducts(data);
        })
        .catch((err) => console.warn('[App] Auto-refresh products error:', err));
    };

    refreshProducts();
    const timer = setInterval(refreshProducts, 3000);
    window.addEventListener('focus', refreshProducts);
    return () => {
      clearInterval(timer);
      window.removeEventListener('focus', refreshProducts);
    };
  }, []);

  const handleAddOrder = async (newOrder) => {
    if (!currentUser) {
      showToast("Vui lòng đăng nhập tài khoản để đặt hàng!", "warning");
      setAuthModalTab("login");
      setPendingCheckout(true);
      setIsAuthOpen(true);
      return { error: true, message: "Yêu cầu đăng nhập tài khoản để đặt hàng" };
    }

    try {
      const fullAddress = [
        newOrder.customer?.address,
        newOrder.customer?.district,
        newOrder.customer?.city
      ].filter(Boolean).join(", ") || newOrder.address || '';

      const created = await orderService.createOrder({
        orderId: newOrder.orderId,
        customerName: newOrder.customer?.fullName || currentUser.fullName || currentUser.name,
        phone: currentUser.phone,
        address: fullAddress,
        note: newOrder.customer?.note || newOrder.note || '',
        paymentMethod: newOrder.paymentMethod,
        items: newOrder.items,
        subtotal: newOrder.subtotal,
        discount: newOrder.discountAmount || newOrder.discount || 0,
        total: newOrder.total,
        status: newOrder.status,
        voucherCode: newOrder.voucherCode || newOrder.maVoucher || '',
      });
      const mergedOrder = {
        ...newOrder,
        ...(created || {}),
        customer: newOrder.customer || created?.customer || {
          fullName: created?.customerName || newOrder.customer?.fullName,
          phone: created?.phone || currentUser.phone,
          address: created?.address || newOrder.customer?.address,
        },
      };
      setOrders((prev) => [mergedOrder, ...prev]);
      return { success: true, order: mergedOrder };
    } catch (err) {
      console.error('[App] Lỗi lưu đơn hàng vào backend:', err);
      showToast(err.message || 'Không thể tạo đơn hàng', 'warning');
      return { error: true, message: err.message };
    }
  };

  const handleCancelOrder = (orderId, reason) => {
    setOrders((prev) =>
      prev.map((o) => (o.orderId === orderId ? { ...o, status: "Đã hủy", cancelReason: reason } : o))
    );
    showToast(`Đã hủy thành công đơn hàng #${orderId}`, "info");
  };

  const handleReorder = (items) => {
    setCart((prev) => [...prev, ...items]);
    setIsCartOpen(true);
    showToast("Đã thêm các sản phẩm vào giỏ hàng!", "success");
  };

  const handleAddReview = async (productId, newReview) => {
    try {
      await reviewService.addReview(productId, newReview);
      const updated = await productService.getById(productId);
      if (updated) {
        setProducts((prev) => prev.map((p) => (p.id === productId ? updated : p)));
      }
    } catch (err) {
      console.warn('[App] Lưu review lên SQLite thất bại, chuyển lưu cục bộ:', err);
    }
    setProductReviews((prev) => {
      const updated = { ...prev, [productId]: [newReview, ...(prev[productId] || [])] };
      setStorage("net_custom_reviews", updated);
      return updated;
    });
    showToast("Cảm ơn bạn đã gửi đánh giá!", "success");
    showToast("Cảm ơn bạn! Đánh giá đã được xuất bản trên nét.", "success");
  };

  useEffect(() => setStorage("net_cart", cart), [cart]);
  useEffect(() => setStorage("net_wishlist", wishlist), [wishlist]);
  useEffect(() => setStorage("net_orders", orders), [orders]);
  useEffect(() => setStorage("net_user", currentUser), [currentUser]);

  // 3. UI STATE
  const [isCartOpen, setIsCartOpen] = useState(false);
  const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
  const [isAuthOpen, setIsAuthOpen] = useState(false);
  const [quickViewProduct, setQuickViewProduct] = useState(null);
  const [searchQuery, setSearchQuery] = useState("");
  const [isSearchFocused, setIsSearchFocused] = useState(false);
  const [toasts, setToasts] = useState([]);
  const [faqOpen, setFaqOpen] = useState({});

  const searchInputRef = useRef(null);

  // Toast System
  const showToast = (message, type = "success") => {
    const id = Date.now() + Math.random();
    setToasts((prev) => [...prev, { id, message, type }]);
    setTimeout(() => {
      setToasts((prev) => prev.filter((t) => t.id !== id));
    }, 3200);
  };

  // 4. CART INTERACTIONS
  const addToCart = (product, options = {}) => {
    const selectedColor = options.color || (product.colors && product.colors[0]?.name) || "Tiêu chuẩn";
    const selectedStorage = options.storage || (product.storageOptions && product.storageOptions[0]?.label) || "Tiêu chuẩn";
    const priceDiff = Number(options.priceDiff) || 0;

    // Ưu tiên 1: Giá đã được tính sẵn từ options (ví dụ từ trang PDP hoặc biến thể)
    let finalPrice = (options.price !== undefined && options.price !== null)
      ? Number(options.price)
      : (Number(product.price) + priceDiff);
    finalPrice = Math.max(0, finalPrice);

    let finalOrigPrice = (options.originalPrice !== undefined && options.originalPrice !== null)
      ? Number(options.originalPrice)
      : ((Number(product.originalPrice) || Number(product.price)) + priceDiff);
    finalOrigPrice = Math.max(finalPrice, finalOrigPrice);

    const cartItemId = options.variant
      ? `${product.id}-${options.variant}`
      : `${product.id}-${selectedColor}-${selectedStorage}`;

    setCart((prevCart) => {
      const existing = prevCart.find((item) => item.cartItemId === cartItemId);
      if (existing) {
        return prevCart.map((item) =>
          item.cartItemId === cartItemId
            ? { ...item, quantity: item.quantity + (options.quantity || 1), price: finalPrice }
            : item
        );
      }
      return [
        ...prevCart,
        {
          cartItemId,
          id: product.id,
          name: product.name,
          fullName: product.fullName || product.name,
          price: finalPrice,
          originalPrice: finalOrigPrice,
          img: options.img || product.img,
          selectedColor,
          selectedStorage: options.variant || selectedStorage,
          quantity: options.quantity || 1,
        },
      ];
    });

    showToast(`Đã thêm "${product.name}" vào giỏ hàng!`);
  };

  const updateCartQuantity = (cartItemId, delta) => {
    setCart((prev) =>
      prev
        .map((item) => {
          if (item.cartItemId === cartItemId) {
            const newQty = item.quantity + delta;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        })
        .filter(Boolean)
    );
  };

  const removeFromCart = (cartItemId) => {
    setCart((prev) => prev.filter((item) => item.cartItemId !== cartItemId));
    showToast("Đã xóa sản phẩm khỏi giỏ hàng", "info");
  };

  const clearCart = () => {
    setCart([]);
    showToast("Đã dọn sạch giỏ hàng", "info");
  };

  const totalCartCount = useMemo(
    () => cart.reduce((total, item) => total + item.quantity, 0),
    [cart]
  );

  const cartSubtotal = useMemo(
    () => cart.reduce((total, item) => total + Math.max(0, Number(item.price) || 0) * item.quantity, 0),
    [cart]
  );

  // 5. WISHLIST TOGGLE
  const toggleWishlist = (productId, productName) => {
    setWishlist((prev) => {
      const exists = prev.includes(productId);
      if (exists) {
        showToast(`Đã bỏ "${productName}" khỏi yêu thích`, "info");
        return prev.filter((id) => id !== productId);
      } else {
        showToast(`Đã lưu "${productName}" vào yêu thích!`);
        return [...prev, productId];
      }
    });
  };

  // 6. SEARCH & HOTKEY
  useEffect(() => {
    const handleKeyDown = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        searchInputRef.current?.focus();
      }
      if (e.key === "Escape") {
        setQuickViewProduct(null);
        setIsCartOpen(false);
        setIsMobileMenuOpen(false);
        setIsAuthOpen(false);
      }
    };
    window.addEventListener("keydown", handleKeyDown);
    return () => window.removeEventListener("keydown", handleKeyDown);
  }, []);

  // Lọc sản phẩm hiển thị trên Client: Chỉ hiển thị các sản phẩm có trạng thái Đang bán (active), ẩn hoàn toàn các sản phẩm Tạm ẩn (inactive)
  const activeProducts = useMemo(() => {
    return products.filter((p) => (p.status || p.trangThai || "active") === "active");
  }, [products]);

  const searchResults = useMemo(() => {
    if (!searchQuery.trim()) return [];
    const q = searchQuery.toLowerCase().trim();
    return activeProducts.filter(
      (p) =>
        p.name.toLowerCase().includes(q) ||
        p.brand.toLowerCase().includes(q) ||
        (p.specsShort && p.specsShort.toLowerCase().includes(q))
    ).slice(0, 5);
  }, [activeProducts, searchQuery]);

  const handleSearchSubmit = (e) => {
    e.preventDefault();
    if (searchQuery.trim()) {
      setIsSearchFocused(false);
      navigate(`#/category/all?q=${encodeURIComponent(searchQuery.trim())}`);
    }
  };

  return (
    <div className="NTTrangChCNgNgh w-full min-h-screen bg-white text-[#141923] flex flex-col font-sans selection:bg-[#0275A9] selection:text-white">
      {/* HEADER */}
      <Header
        storeSettings={storeSettings}
        currentRoute={currentRoute}
        navigate={navigate}
        searchQuery={searchQuery}
        setSearchQuery={setSearchQuery}
        isSearchFocused={isSearchFocused}
        setIsSearchFocused={setIsSearchFocused}
        searchResults={searchResults}
        handleSearchSubmit={handleSearchSubmit}
        totalCartCount={totalCartCount}
        wishlist={wishlist}
        currentUser={currentUser}
        setIsCartOpen={setIsCartOpen}
        setIsAuthOpen={setIsAuthOpen}
        setIsMobileMenuOpen={setIsMobileMenuOpen}
        searchInputRef={searchInputRef}
        showToast={showToast}
      />

      {/* DYNAMIC ROUTED CONTENT AREA */}
      <main className="flex-1 w-full max-w-[1440px] mx-auto">
        {currentRoute.page === "home" && (
          <HomePage
            products={activeProducts}
            banners={banners}
            articles={articles}
            faqs={faqs}
            settings={storeSettings}
            isLoading={isLoadingProducts}
            onAddToCart={addToCart}
            onToggleWishlist={toggleWishlist}
            wishlist={wishlist}
            onQuickView={setQuickViewProduct}
            onNavigate={navigate}
            faqOpen={faqOpen}
            setFaqOpen={setFaqOpen}
            onShowToast={showToast}
          />
        )}

        {currentRoute.page === "pdp" && (
          <ProductDetailPage
            products={products}
            productId={currentRoute.productId}
            onAddToCart={addToCart}
            onToggleWishlist={toggleWishlist}
            wishlist={wishlist}
            onNavigate={navigate}
            onShowToast={showToast}
            customReviews={productReviews[currentRoute.productId] || []}
            onAddReview={handleAddReview}
            storeSettings={storeSettings}
          />
        )}

        {currentRoute.page === "category" && (
          <CategoryPage
            products={activeProducts}
            categorySlug={currentRoute.categorySlug}
            onAddToCart={addToCart}
            onToggleWishlist={toggleWishlist}
            wishlist={wishlist}
            onQuickView={setQuickViewProduct}
            onNavigate={navigate}
            onShowToast={showToast}
          />
        )}

        {currentRoute.page === "checkout" && (
          <CheckoutPage
            cart={cart}
            cartSubtotal={cartSubtotal}
            onClearCart={clearCart}
            onNavigate={navigate}
            currentUser={currentUser}
            onAddOrder={handleAddOrder}
            onShowToast={showToast}
            selectedVoucherCode={selectedVoucherCode}
            onOpenVoucherModal={() => setIsVoucherModalOpen(true)}
            onClearSelectedVoucher={() => setSelectedVoucherCode("")}
            onOpenAuthModal={(tab = "login") => {
              setAuthModalTab(tab);
              setPendingCheckout(true);
              setIsAuthOpen(true);
            }}
          />
        )}

        {currentRoute.page === "order-success" && (
          <OrderSuccessPage
            orderId={currentRoute.orderId}
            orders={orders}
            onNavigate={navigate}
            storeSettings={storeSettings}
          />
        )}

        {currentRoute.page === "orders" && (
          <OrdersHistoryPage
            orders={orders}
            onNavigate={navigate}
            onShowToast={showToast}
            onCancelOrder={handleCancelOrder}
            onReorder={handleReorder}
          />
        )}
      </main>

      {/* FOOTER */}
      <Footer navigate={navigate} showToast={showToast} storeSettings={storeSettings} />

      {/* CART DRAWER */}
      <CartDrawer
        isOpen={isCartOpen}
        onClose={() => setIsCartOpen(false)}
        cart={cart}
        totalCartCount={totalCartCount}
        cartSubtotal={cartSubtotal}
        updateQuantity={updateCartQuantity}
        removeFromCart={removeFromCart}
        clearCart={clearCart}
        onOpenVoucherModal={() => setIsVoucherModalOpen(true)}
        currentUser={currentUser}
        onCheckout={() => {
          setIsCartOpen(false);
          if (!currentUser) {
            setAuthModalTab("login");
            setPendingCheckout(true);
            setIsAuthOpen(true);
            showToast("Vui lòng đăng nhập hoặc đăng ký tài khoản để thanh toán", "info");
            return;
          }
          navigate("#/checkout");
        }}
        navigate={navigate}
        vouchers={vouchers}
      />

      {/* VOUCHER MODAL */}
      <VoucherModal
        isOpen={isVoucherModalOpen}
        onClose={() => setIsVoucherModalOpen(false)}
        onSelectVoucher={(code) => {
          setSelectedVoucherCode(code);
        }}
        cartSubtotal={cartSubtotal}
        currentCode={selectedVoucherCode}
        vouchers={vouchers}
      />

      {/* AUTH MODAL */}
      <AuthModal
        isOpen={isAuthOpen}
        initialTab={authModalTab}
        onClose={() => {
          setIsAuthOpen(false);
          setPendingCheckout(false);
        }}
        currentUser={currentUser}
        onLogin={(userData) => {
          setCurrentUser(userData);
          showToast(`Chào mừng trở lại, ${userData.fullName || userData.name}!`, "success");
          if (pendingCheckout) {
            setPendingCheckout(false);
            navigate("#/checkout");
          }
        }}
        onLogout={() => {
          setCurrentUser(null);
          setOrders([]);
          localStorage.removeItem("net_user");
          localStorage.removeItem("net_auth_token");
          showToast("Đã đăng xuất tài khoản", "info");
        }}
        onNavigateOrders={() => {
          setIsAuthOpen(false);
          navigate("#/orders");
        }}
        onShowToast={showToast}
        onUpdateProfile={(updatedUser) => {
          setCurrentUser(updatedUser);
        }}
      />

      {/* QUICK VIEW MODAL */}
      <QuickViewModal
        product={quickViewProduct}
        onClose={() => setQuickViewProduct(null)}
        onAddToCart={(p) => addToCart(p)}
        onViewDetail={(id) => navigate(`#/product/${id}`)}
      />

      {/* TOAST SYSTEM */}
      {toasts.map((toast) => (
        <Toast key={toast.id} toast={toast} />
      ))}
    </div>
  );
}


// Mount React Root to DOM
const rootElement = document.getElementById('root');
const root = ReactDOM.createRoot(rootElement);
root.render(<App />);
  </script>
</body>
</html>
